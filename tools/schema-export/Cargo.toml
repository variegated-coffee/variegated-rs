[package]
name = "variegated-schema-export"
version = "0.1.0"
edition = "2024"

# Its own workspace root, deliberately.
#
# This package lives inside variegated-comms-rs but must never be built as part of it.
# It is a std host tool, while every member of that workspace targets
# riscv32imac-unknown-none-elf -- `cargo check --workspace` would try to build this for
# a target with no std and fail. An empty `[workspace]` table stops cargo from
# adopting it as a member when the firmware path-depends on it.
[workspace]

[lib]
bench = false

[[bin]]
name = "variegated-schema-export"
path = "src/main.rs"

[dependencies]
variegated-postcard-schema = { path = "../../variegated-rs/variegated-postcard-schema", features = ["heapless", "chrono"] }
variegated-controller-types = { path = "../../variegated-rs/variegated-controller-types", default-features = false, features = ["schema", "std"] }
variegated-comms-api-types = { path = "../../crates/variegated-comms-api-types", features = ["schema"] }
# For the fixtures only: `PidOut`'s fields and `Limits::new_with_limits`, which the
# controller-types aliases do not re-export.
variegated-control-algorithm = { path = "../../variegated-rs/variegated-control-algorithm", features = ["serde"] }
# Fixtures are serialized both ways: postcard for the bytes the decoder must reproduce,
# and JSON as the independent reference for field names and structure.
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
heapless = { version = "0.9.3", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
