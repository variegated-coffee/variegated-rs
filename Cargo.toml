[workspace]
# Layout: a crate that produces a flashable binary lives in `firmwares/`, everything else
# in `crates/`. Sibling path dependencies inside `crates/` are plain -- `../variegated-hal`
# from `crates/variegated-controller-lib` resolves -- which is why only the three firmware
# manifests carry `../../crates/`.
members = [
    "firmwares/variegated-silvia-firmware",
    "firmwares/variegated-gs3-firmware",

    "crates/variegated-adc-tools",
    "crates/variegated-controller-lib",
    "crates/variegated-controller-types",
    "crates/variegated-control-algorithm",
    "crates/variegated-ads124s08",
    "crates/variegated-embassy-dual-c595-shift-register",
    "crates/variegated-fdc1004",
    "crates/variegated-gravity-driver",
    "crates/variegated-mcp9600",
    "crates/variegated-nau7802",
    "crates/variegated-tlc59108",
    "crates/variegated-embassy-rp-frequency-counter",
    "crates/variegated-hal",
    "crates/variegated-log",
    "crates/variegated-soft-pwm",
    "crates/variegated-instrumentation",
    "crates/variegated-mcp23017",
    "crates/variegated-nv3007",
    "crates/variegated-comms",
    "crates/variegated-exfat-format",
    "crates/variegated-timekeeping",
    "crates/variegated-rp235x-atomic-raw-mutex",
    "crates/variegated-debug-codec",
    "crates/variegated-debug",
    "crates/variegated-postcard-schema",
    "crates/variegated-postcard-schema-derive",

    # The `#[board_cfg(...)]` / `aliased_bind_interrupts!` macro. It is published to
    # crates.io from here. Both it and its fixture crate are deliberately absent from
    # `default-members` below -- see the note there, the reasons are not the same.
    "crates/variegated-board-cfg",
    "crates/variegated-board-cfg-tests",

    # The ESP32-C6 comms side. The first six are portable no_std and would build for
    # either architecture; only `variegated-comms-firmware` is riscv32-only, and it is the
    # reason for `default-members` below.
    "crates/variegated-comms-api-types",
    "crates/variegated-shot-upload",
    "crates/variegated-trouble-connection-manager",
    "crates/variegated-belka-portal-trouble-driver",
    "crates/variegated-scale-trouble-driver",
    "crates/variegated-improv-trouble",
    "firmwares/variegated-comms-firmware",
]

# This workspace spans two architectures, so `--workspace` is not a usable command here:
# it would try to build `esp-hal` for thumbv8m and fail with a wall of errors that name
# nothing relevant. `default-members` is what keeps a bare `cargo build` meaning "the
# RP2350 side", which is what it has always meant.
#
# The seven comms crates are deliberately *all* absent from this list, not just the
# riscv-only firmware. Including the six portable ones would compile the whole BLE stack
# for thumbv8m on every build -- and `variegated-shot-upload` would build MbedTLS from
# source for it, which is worse. Less obviously, resolver 2 unifies features across
# one invocation's graph, so `variegated-comms-api-types` asking for
# `variegated-controller-types/serde` would newly enable serde inside the espresso
# firmwares. They still get compile coverage: every comms firmware build compiles them.
#
# Build the comms firmware with `cd firmwares/variegated-comms-firmware && cargo build`, or
# `scripts/build-comms-firmware.sh`. It cannot be built from here -- see that directory's
# `.cargo/config.toml` and `rust-toolchain.toml`.
default-members = [
    "firmwares/variegated-silvia-firmware",
    "firmwares/variegated-gs3-firmware",
    "crates/variegated-adc-tools",
    "crates/variegated-controller-lib",
    "crates/variegated-controller-types",
    "crates/variegated-control-algorithm",
    "crates/variegated-ads124s08",
    "crates/variegated-embassy-dual-c595-shift-register",
    "crates/variegated-fdc1004",
    "crates/variegated-gravity-driver",
    "crates/variegated-mcp9600",
    "crates/variegated-nau7802",
    "crates/variegated-tlc59108",
    "crates/variegated-embassy-rp-frequency-counter",
    "crates/variegated-hal",
    "crates/variegated-log",
    "crates/variegated-soft-pwm",
    "crates/variegated-instrumentation",
    "crates/variegated-mcp23017",
    "crates/variegated-nv3007",
    "crates/variegated-comms",
    "crates/variegated-exfat-format",
    "crates/variegated-timekeeping",
    "crates/variegated-rp235x-atomic-raw-mutex",
    "crates/variegated-debug-codec",
    "crates/variegated-debug",
    "crates/variegated-postcard-schema",
    "crates/variegated-postcard-schema-derive",
    # Neither `variegated-board-cfg` nor its fixture crate is here, for two different
    # reasons.
    #
    # The fixture is an ordinary std crate; a bare `cargo build` would compile it for
    # thumbv8m. Run it with `cargo test-aarch64 -p variegated-board-cfg-tests`.
    #
    # The macro is a proc macro, and "cargo builds proc macros for the host" holds only
    # while it is a *dependency*. Name the package explicitly -- which membership of this
    # list does -- and cargo builds it for `--target` like anything else, so `serde_core`
    # and `either` get compiled for thumbv8m and produce thousands of errors. It is
    # covered anyway: every firmware build compiles it as a host dependency, which is
    # where its warnings surface.
]

# A std host tool that declares its own `[workspace]`. Without this exclusion cargo
# reports "multiple workspace roots found in the same workspace"; with it, but without
# that nested table, cargo would try to build it for a bare-metal target where it has no
# std. Both halves are needed. It reaches the comms firmware as a build-dependency, which
# cargo compiles as a host unit regardless.
#
# It sits in `crates/` rather than under `firmwares/variegated-comms-firmware/`, where it
# would be more obviously "that firmware's build input": `exclude` does not reach a
# package nested inside a *member's* directory, and cargo fails with "multiple workspace
# roots found in the same workspace". `crates/` is not itself a package, so excluding a
# directory inside it works.
exclude = [
    "crates/variegated-schema-export",
]

resolver = "2"
# `edition` is here for the comms crates, which inherit it with `edition.workspace = true`.
# The RP2350 crates all state their own and are unaffected.
package = { rust-version = "1.88", edition = "2024" }

# Single source of truth for dependency versions.
#
# Member crates inherit with `dep.workspace = true` and add their own
# `features`/`optional`/`default-features` on top. Keep versions here only --
# feature sets belong in the members that need them, since features are additive
# across the whole graph.
[workspace.dependencies]
# Embassy. These must move as a set; mixing minor versions puts two
# incompatible copies of e.g. `SpiDevice` or `RawMutex` in one binary.
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-rp = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
# embassy-usb 0.6.0 is already in Cargo.lock via embassy-usb-logger; this promotes it
# to a direct dependency for the CDC-ACM debug transport.
embassy-usb = "0.6.0"

# Logging / panic handling. defmt, defmt-rtt and panic-probe are a set.
defmt = "1.1.1"
defmt-rtt = "1.3.0"
log = "0.4.33"
panic-probe = "1.0.0"

# embedded-hal ecosystem
#
# embedded-graphics/-core are pinned back on purpose. The 0.8.2 / 0.4.1
# releases (both 2026-02-15) are build-only -- an MSRV fix plus doc links, no
# functional change -- and their "tighter dependencies" narrowed `az` from
# `^1.2.0` to `~1.2.0`. That pin exists because az 1.3.0 declares
# rust-version 1.85.0 while embedded-graphics' MSRV is 1.71.1; it is not an API
# or correctness concern, and it does not apply to us (we are on 1.88/1.95).
#
# `fixed` 1.30+ moved to `az ^1.3`. az 1.2 and 1.3 are semver-compatible so
# cargo must unify them, which makes 0.8.2/0.4.1 and fixed 1.30+ mutually
# exclusive. We take `fixed` (real bug fixes, see below) and give up a release
# that changes no code. Revisit if embedded-graphics relaxes the pin.
embedded-graphics = "=0.8.1"
embedded-graphics-core = "=0.4.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-storage-async = "0.4.1"
display-interface = "0.5"
display-interface-spi = "0.5"

# Serialization / storage
crc = "3.4.0"
postcard = "1.1.3"
# NOTE: the `postcard` feature is deliberately NOT enabled. It brings a blanket
# `impl<T: PostcardValue> Value for T`, which both collides with our hand-written
# `Value` impls and, more importantly, serializes with plain postcard. Ours use
# `to_slice_crc32`/`from_bytes_crc32` with CRC_32_ISCSI, and that is the format
# already on deployed machines' flash.
sequential-storage = "8.0.1"
serde = { version = "1.0.229", default-features = false }

# SD card and filesystem.
#
# These replace `embedded-sdmmc`, which is blocking-only. Driving a blocking SD
# stack from an async executor meant `embassy_futures::block_on`, and `block_on`
# busy-polls with a no-op waker without ever re-entering the executor -- so a
# `block_on` over the display bus's async `Mutex` could never observe the display
# task releasing it. That deadlocked core 1 outright, and no amount of tuning the
# old path fixes it. Both of these are async to the bottom.
#
# `sdio` handles the identification sequence itself: `INIT_FREQ` is 400_000 and it
# calls `SetHz` down to that before CMD0 and back up to the target afterwards. The
# 10 MHz-throughout bus the old code handed to `SdCard::new` is very likely why the
# card never enumerated -- the SD physical spec requires 100-400 kHz there.
#
# `aligned` and `block-device-driver` are declared here because BOTH of the above
# depend on them, and their unification is what makes the stack fit together at
# all: `exfat_slim::asynchronous::BlockDevice` is a re-export of
# `block_device_driver::BlockDevice`, and `sdio::BlockDevice` implements that same
# trait -- so `sdio` plugs straight into `exfat-slim` with no adapter in between.
# That only holds while cargo unifies them. `sdio` asks for aligned 0.4.3 and
# exfat-slim for 0.4.2; they are semver-compatible and resolve to one copy. If a
# future bump split them, `Aligned<A, [u8; 512]>` would become two distinct types
# and the trait impl would stop applying -- with an error pointing at the trait
# bound rather than at the version skew that caused it.
sdio = "0.5.0"
# NOTE: exfat-slim's `embassy` feature is deliberately NOT enabled. It pulls
# embassy-sync 0.7.2, which cannot unify with the 0.8.0 above, and we need none of
# what it provides -- only the `defmt` feature is used.
# 0.6.0 does not exist on crates.io: it is supplied entirely by the `[patch.crates-io]`
# entry below, which points at upstream's master. The requirement has to name 0.6.0
# rather than 0.5.0 because a patch must be semver-compatible with what it replaces --
# leaving this at "0.5.0" makes cargo silently ignore the patch and build the broken
# published crate, with nothing but a warning buried in the build log to say so.
exfat-slim = "0.6.0"
aligned = "0.4.3"
block-device-driver = "0.2.0"

# Core no-std libraries
bitvec = { version = "1.1.1", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
cfg-if = "1.0.4"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = { version = "0.10.4", default-features = false }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
# 0.6 renamed `Heap` to `LlffHeap` and gated it behind `llff`; `tlsf` is a
# second allocator we don't use, so keep it out rather than compiling rlsf.
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
# 1.30.0, not 1.31.0: 1.31 requires rustc 1.93, which would falsify the
# `rust-version = "1.88"` above, and it only adds `unchecked_*` methods we do
# not use. 1.30 needs 1.85 and carries the changes that matter -- the
# readonly-statics bug fix (`compat-readonly-static`) and a formatting fix at
# defined precision. It is also where the `az ^1.3` requirement starts.
fixed = "~1.30"
heapless = "0.9.3"
micromath = "2.1.0"
movavg = { version = "2.5.0", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
paste = "1.0.15"
pio = "0.3.0"
portable-atomic = { version = "1.14", default-features = false }
static_cell = "2.1.1"
ux = "0.1.6"

# Async helpers
async-trait = "0.1.91"

# Proc-macro authoring, for variegated-postcard-schema-derive. These three move as a
# set -- syn is built on proc-macro2's token types, so mixing majors would put two
# incompatible `TokenStream`s in one macro.
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
# UI tests for the derive's serde-attribute rejection. That rejection is the whole
# anti-drift guarantee, so it is tested like one.
trybuild = "1.0"

# `variegated-board-cfg`'s own three. Host-side only -- they reach no firmware binary,
# since a proc macro's dependencies are compiled for the build host.
#
# Inflector supplies the case conversions that turn a board-cfg.toml key into a type
# alias ident. 0.11.4 is the newest release there is and has been for years; `heck` is
# the maintained equivalent and a swap is a self-contained afternoon, noted here rather
# than done as a side effect of moving the crate in.
Inflector = "0.11.4"
either = "1.13.0"
toml = "0.8.19"

# ---------------------------------------------------------------------------------
# ESP32-C6 comms side. Only `variegated-comms-firmware` and the BLE crates use these.
# ---------------------------------------------------------------------------------

# BLE. trouble-host is held at 0.6.0, NOT 0.7.0: esp-radio 0.18 depends on bt-hci 0.8,
# while trouble-host 0.7 requires bt-hci ^0.9. Only esp-hal `main` (unreleased) is on
# bt-hci 0.9. 0.6.0 is a strict superset of the git revision this used to pin (53e34022,
# 2025-11-14, between v0.5.0 and v0.5.1), so the multi-peripheral fix that motivated the
# pin is included.
#
# Note trouble-host 0.6.0 asks for embassy-sync ^0.7 while esp-hal/esp-radio need ^0.8,
# so two embassy-sync versions coexist in the lockfile. That is harmless -- the
# esp-radio <-> trouble interface is bt-hci's `Controller` trait, not an embassy-sync
# type. Just don't pass a channel across that boundary. `variegated-improv-trouble`
# pins its own `embassy-sync = "0.7"` for this reason and must not be "tidied" to
# `workspace = true`.
trouble-host = "0.6.0"
bt-hci = "0.8"

embassy-net = "0.9.1"

# esp-hal family. These move as a set.
# `internal-heap-stats` for `HeapStats::max_usage`. The heap here is sized against a peak
# occupancy figure, and until this was enabled that figure came from a one-off measurement
# recorded in a comment -- which is how the machine ended up panicking on a 128-byte
# allocation with no way to tell a slow leak from a high-water mark nobody had ever looked
# at. The feature costs one comparison per allocation.
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
esp-backtrace = "0.19.0"
esp-bootloader-esp-idf = "0.5.0"
esp-hal = "1.1.1"
# `default-features = false` has to live here rather than on the member: cargo refuses
# `default-features = false` on an inherited dependency whose workspace entry does not
# already carry it. What is being dropped is the `auto` output target, which probes for
# USB-Serial-JTAG at runtime and would contend with the structured debug stream. The
# member then selects `no-op` -- no output target at all -- and explains the trade;
# `uart` was tried in between and rejected.
esp-println = { version = "0.17.0", default-features = false }
esp-radio = "0.18.0"
esp-rtos = "0.3.0"

# Networking
edge-http = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
edge-net = "0.14.0"
edge-ws = { version = "0.8.0", default-features = false }
# TLS for shot-log upload. `default-features = false` lives here rather than on the member
# for the same cargo reason as `esp-println` above, and it matters more: the default `tls`
# bundle compiles in every algorithm MbedTLS has, and the algorithm set is what determines
# the per-connection record-buffer overhead. The member selects a curated set; see the
# comment there, which is where the arithmetic lives.
mbedtls-rs = { version = "0.1.0", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
smoltcp = { version = "0.13.1", default-features = false }
sntpc = { version = "0.11.0", default-features = false }
jiff = { version = "0.2.35", default-features = false }

[profile.dev]
debug = true
# `opt-level = 3` is a *correctness* setting on this firmware, not a performance one, and
# cargo only honours the profile in the workspace **root** manifest -- a copy in a member's
# manifest is silently ignored.
#
# At opt-level 1 rustc does not coalesce async state-machine locals, which inflates poll
# frames enormously. `CORE1_STACK_LENGTH` in `variegated-gs3-firmware` documents that
# effect as the reason core 1 needs 96 kB. On core 0 it was worse: a single `Join5::poll`
# in `esp_transceiver_main` exhausted the 192,452-byte stack and silently overwrote `.bss`,
# where the executor's task arena and the embassy timer queue live, so the machine died in
# `Queue::next_expiration` chasing a pointer that had been overwritten with painted stack.
# Nothing traps by default; it took a stack guard and a fault-register dump to find.
#
# If debugging ever needs opt-level 1 back, expect the stack margin to vanish with it, and
# check `core0_stack_high_water()` first.
opt-level = 3
lto = true

[profile.release]
debug = true             # Keep debug info in release builds too

# The comms firmware's release settings, as a profile of its own rather than edits to
# `release` above.
#
# The two architectures in this workspace want opposite things and only the root
# manifest's profiles are honoured, so there is no way to give them each their own `dev`
# and `release`. RP2350 needs `opt-level = 3` for stack-frame *correctness* -- see the
# long note on `[profile.dev]` -- while the ESP32-C6 build needs `opt-level = "s"` and
# fat LTO to fit its flash budget.
#
# Per-package overrides (`[profile.release.package.variegated-comms-firmware]`) do not
# solve this. They reach only that package's own code, not `esp-hal`, `smoltcp` or
# `trouble-host`, which is where the size actually is -- and `lto` is not a per-package
# key at all.
#
# Built with `cargo build --profile comms-release` from `variegated-comms-firmware/`;
# artifacts land in `target/riscv32imac-unknown-none-elf/comms-release/`.
[profile.comms-release]
inherits         = "release"
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = "fat"
opt-level        = "s"
overflow-checks  = false

# NOTE: the graph contains embassy-hal-internal 0.4.0 and 0.5.0 side by side.
# This is an upstream packaging bug: the *published* embassy-embedded-hal 0.6.0
# requires embassy-hal-internal "0.4.0", while the git tag it was cut from
# (embassy-embedded-hal-v0.6.0) correctly says "0.5.0" -- which is what
# embassy-rp 0.10.0 uses.
#
# Patching embassy-embedded-hal to that tag does NOT work in isolation: the git
# crate resolves its siblings by path, dragging in embassy-time from git, whose
# embassy-time-driver declares `links = "embassy-time"`. Only one package in a
# graph may claim a given `links` value, so it collides with the crates.io
# embassy-time-driver that embassy-rp depends on. Fixing it that way means
# sourcing the *entire* embassy family from git, trading a harmless duplicate
# for a large git-sourced dependency surface.
#
# Left alone deliberately, because the duplicate is inert: embassy-embedded-hal
# touches embassy-hal-internal in exactly one place -- `drop::OnDrop`, an RAII
# guard used inside two function bodies in shared_bus/asynch/spi.rs. It appears
# in no signature, and `SetConfig`/`GetConfig` are defined in
# embassy-embedded-hal itself, so no type crosses between the two versions.
# The cost is compiling one small extra crate. Revisit if upstream publishes a
# fixed embassy-embedded-hal.

# sdio's SPI transport does not work as published, and does not work on its master
# either. `read_response_words` packs the R1 status byte into `words[0]`, where
# `Response::from_words` expects the 32-bit payload, and reads five trailing bytes
# where SPI framing has four. Every field therefore comes out shifted by a byte: CMD8
# returns check pattern 0x01 instead of 0xAA and a zero voltage nibble, so
# `Card::acquire` rejects a working card with `MmcError::Voltage`. CMD8 is the second
# command of every initialisation, so no card can be identified over SPI at all -- the
# module has evidently never been run. `sd.rs` is shared with the native SDMMC path
# that embassy's STM32 users exercise, and is not implicated.
#
# The fork carries that fix plus regression tests for the word layout. It is a path
# dependency on a sibling checkout in the umbrella directory -- as `esphome-device-rs`
# still is for the comms firmware -- so the two move together without a push.
#
# Known-unfixed there: SPI mode returns from `Card::acquire` before CMD9, so the CSD is
# never read and `BlockDevice::size()` reports 0. Harmless here -- exfat-slim never
# calls it, and block-versus-byte addressing comes from the OCR, which SPI does read --
# but it must be fixed before upstreaming.

# exfat-slim 0.5.0 as published under-allocates by one cluster on any write to a file
# that has no clusters yet. `File::write` credits the file with a full cluster of free
# space -- `cluster_length - (data_length % cluster_length)`, which for `data_length == 0`
# is a whole cluster -- and then allocates only the remainder. The `NO_CLUSTER_ID` case is
# handled solely in an `else if` that a large write never reaches.
#
# So a 51,300-byte shot on a 32 KiB-cluster card allocated one cluster where it needed
# two, wrote 32,768 bytes, and failed with `EndOfFatChain`. The file was left at its full
# declared length -- `update_data_length` runs before the write loop -- with the last
# 18,532 bytes as zeros. That is exactly 51,300 - 32,768, and it is what a shot pulled off
# this machine actually looked like: valid postcard for 264 of 412 samples, then a hole.
# It reads as a run of empty samples rather than as corruption, because a zero byte is a
# legal encoding of an empty map, a `None` and a zero varint alike. Only the CRC catches
# it, and only on download.
#
# **Upstream has already fixed it**, in 65ed244 ("Fix actor short reads, multi cluster
# reads, write allocation and mid cluster seek bugs", 2026-08-02), which is on master as
# 0.6.0 but unpublished -- 0.5.0 is still the newest on crates.io. So this is a pin to
# upstream's own work, not a patch of ours: nothing in the checkout is modified, and it
# goes away the day 0.6.0 ships. The branch `variegated-pin` exists only so master cannot
# move underneath us.
#
# The same commit fixes multi-cluster *reads* and mid-cluster seeks, which is a plausible
# explanation for the `FileNotFound`-masked-by-diagnostics episode recorded in
# `SD_LOG_PROGRESS.md` at the umbrella root (not in this repo) -- worth re-checking that
# open question against this version.
[patch.crates-io]
sdio = { path = "../sdio" }
exfat-slim = { path = "../exfat-slim" }