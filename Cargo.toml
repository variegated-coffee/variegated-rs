[package]
edition      = "2024"
name         = "variegated-comms-rs"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "variegated-comms-rs"
path = "./src/bin/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[dependencies]
bleps = { git = "https://github.com/bjoernQ/bleps", package = "bleps", rev = "a5148d8", features = [
  "async",
  "macros",
] }
blocking-network-stack = { git = "https://github.com/bjoernQ/blocking-network-stack.git", rev = "b3ecefc", default-features = false, features = ["dhcpv4", "dns", "icmp", "ipv4", "defmt", "multicast", "tcp", "udp"] }
embedded-io = { version = "0.6.1", default-features = false }
esp-alloc = { version = "0.9.0" }
esp-backtrace = { version = "0.18.1", features = [
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.4.0" }
esp-hal = { version = "1.0.0", features = ["defmt", "unstable"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash"] }
esp-rtos = { version = "0.2.0", features = ["esp-radio", "defmt"] }
esp-radio = { version = "0.17.0", features = [
  "ble",
  "coex",
  "defmt",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "socket-raw",
] }

[features]
default = [
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-radio/esp32c6",
]


