[workspace]
resolver = "2"
members = [
    "crates/variegated-comms-firmware",
    "crates/variegated-trouble-connection-manager",
    "crates/variegated-belka-portal-trouble-driver",
    "crates/variegated-scale-trouble-driver",
]
# Sibling repos are symlinked into this directory (variegated-rs, idf-port,
# esphome-device-rs). Without excluding them, cargo treats every package under
# those symlinks as a member of *this* workspace, so their `workspace = true`
# dependency inheritance resolves against this manifest instead of their own
# workspace root and fails with "`workspace.dependencies` was not defined".
exclude = [
    "variegated-rs",
    "idf-port",
    "esphome-device-rs",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
