[workspace]
resolver = "2"
members = [
    "crates/variegated-comms-api-types",
    "crates/variegated-comms-firmware",
    "crates/variegated-trouble-connection-manager",
    "crates/variegated-belka-portal-trouble-driver",
    "crates/variegated-scale-trouble-driver",
]
# Sibling repos are symlinked into this directory (variegated-rs, idf-port,
# esphome-device-rs). Without excluding them, cargo treats every package under
# those symlinks as a member of *this* workspace, so their `workspace = true`
# dependency inheritance resolves against this manifest instead of their own
# workspace root and fails with "`workspace.dependencies` was not defined".
exclude = [
    "variegated-rs",
    "idf-port",
    "esphome-device-rs",
    # A std host tool that declares its own `[workspace]`. Without this exclusion cargo
    # reports "multiple workspace roots found in the same workspace"; with it, but
    # without the nested table, cargo would try to build it for riscv32imac, where it
    # has no std. Both halves are needed. It reaches the firmware as a
    # build-dependency, which cargo compiles as a host unit regardless.
    "tools/schema-export",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"

# Single source of truth for dependency versions. Member crates inherit with
# `dep.workspace = true` and add their own features on top. Versions live here;
# feature sets belong in the members, since features are additive across the
# whole graph anyway.
[workspace.dependencies]
# BLE. trouble-host is held at 0.6.0, NOT 0.7.0: esp-radio 0.18 depends on
# bt-hci 0.8, while trouble-host 0.7 requires bt-hci ^0.9. Only esp-hal `main`
# (unreleased) is on bt-hci 0.9. 0.6.0 is a strict superset of the git revision
# this used to pin (53e34022, 2025-11-14, between v0.5.0 and v0.5.1), so the
# multi-peripheral fix that motivated the pin is included.
#
# Note trouble-host 0.6.0 asks for embassy-sync ^0.7 while esp-hal/esp-radio
# need ^0.8, so two embassy-sync versions coexist. That is harmless -- the
# esp-radio <-> trouble interface is bt-hci's `Controller` trait, not an
# embassy-sync type. Just don't pass a channel across that boundary.
trouble-host = "0.6.0"
bt-hci = "0.8"

# Embassy
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = "0.9.1"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

# esp-hal family. These move as a set.
# `internal-heap-stats` for `HeapStats::max_usage`. The heap here is sized against a
# peak occupancy figure, and until this was enabled that figure came from a one-off
# measurement recorded in a comment -- which is how the machine ended up panicking on a
# 128-byte allocation with no way to tell a slow leak from a high-water mark nobody had
# ever looked at. The feature costs one comparison per allocation.
esp-alloc = { version = "0.10.0", features = ["internal-heap-stats"] }
esp-backtrace = "0.19.0"
esp-bootloader-esp-idf = "0.5.0"
esp-hal = "1.1.1"
# `default-features = false` has to live here rather than on the member: Cargo
# refuses `default-features = false` on an inherited dependency whose workspace
# entry does not already carry it. What is being dropped is the `auto` output
# target, which probes for USB-Serial-JTAG at runtime and would contend with the
# structured debug stream. The member then selects `no-op` -- no output target at
# all -- and explains the trade; `uart` was tried in between and rejected.
esp-println = { version = "0.17.0", default-features = false }
esp-radio = "0.18.0"
esp-rtos = "0.3.0"

# Networking
edge-http = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
edge-net = "0.14.0"
edge-ws = { version = "0.8.0", default-features = false }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
smoltcp = { version = "0.13.1", default-features = false }
sntpc = { version = "0.11.0", default-features = false }

# Core
defmt = "1.1.1"
heapless = "0.9.3"
jiff = { version = "0.2.35", default-features = false }
log = "0.4.33"
portable-atomic = { version = "1.14", default-features = false }
postcard = "1.1.3"
serde = { version = "1.0.229", default-features = false }
static_cell = "2.1.1"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
