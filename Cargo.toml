[workspace]
members = [
    "examples",
    "variegated-adc-tools",
    "variegated-controller-lib",
    "variegated-controller-types",
    "variegated-control-algorithm",
    "variegated-ads124s08",
    "variegated-embassy-dual-c595-shift-register",
    "variegated-fdc1004",
    "variegated-gravity-driver",
    "variegated-mcp9600",
    "variegated-nau7802",
    "variegated-tlc59108",
    "variegated-embassy-rp-frequency-counter",
    "variegated-hal",
    "variegated-log",
    "variegated-soft-pwm", "variegated-instrumentation",
    "variegated-mcp23017",
    "variegated-nv3007",
    "variegated-comms",
    "variegated-timekeeping",
    "variegated-rp235x-atomic-raw-mutex",
    "variegated-debug-codec",
    "variegated-debug",
    "variegated-postcard-schema",
    "variegated-postcard-schema-derive",
]
resolver = "2"
package = { rust-version = "1.88" }

# Single source of truth for dependency versions.
#
# Member crates inherit with `dep.workspace = true` and add their own
# `features`/`optional`/`default-features` on top. Keep versions here only --
# feature sets belong in the members that need them, since features are additive
# across the whole graph.
[workspace.dependencies]
# Embassy. These must move as a set; mixing minor versions puts two
# incompatible copies of e.g. `SpiDevice` or `RawMutex` in one binary.
embassy-embedded-hal = "0.6.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-rp = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb-logger = "0.6.0"
# embassy-usb 0.6.0 is already in Cargo.lock via embassy-usb-logger; this promotes it
# to a direct dependency for the CDC-ACM debug transport.
embassy-usb = "0.6.0"

# Logging / panic handling. defmt, defmt-rtt and panic-probe are a set.
defmt = "1.1.1"
defmt-rtt = "1.3.0"
log = "0.4.33"
panic-probe = "1.0.0"

# embedded-hal ecosystem
#
# embedded-graphics/-core are pinned back on purpose. The 0.8.2 / 0.4.1
# releases (both 2026-02-15) are build-only -- an MSRV fix plus doc links, no
# functional change -- and their "tighter dependencies" narrowed `az` from
# `^1.2.0` to `~1.2.0`. That pin exists because az 1.3.0 declares
# rust-version 1.85.0 while embedded-graphics' MSRV is 1.71.1; it is not an API
# or correctness concern, and it does not apply to us (we are on 1.88/1.95).
#
# `fixed` 1.30+ moved to `az ^1.3`. az 1.2 and 1.3 are semver-compatible so
# cargo must unify them, which makes 0.8.2/0.4.1 and fixed 1.30+ mutually
# exclusive. We take `fixed` (real bug fixes, see below) and give up a release
# that changes no code. Revisit if embedded-graphics relaxes the pin.
embedded-graphics = "=0.8.1"
embedded-graphics-core = "=0.4.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-storage-async = "0.4.1"
display-interface = "0.5"
display-interface-spi = "0.5"

# Serialization / storage
crc = "3.4.0"
postcard = "1.1.3"
# NOTE: the `postcard` feature is deliberately NOT enabled. It brings a blanket
# `impl<T: PostcardValue> Value for T`, which both collides with our hand-written
# `Value` impls and, more importantly, serializes with plain postcard. Ours use
# `to_slice_crc32`/`from_bytes_crc32` with CRC_32_ISCSI, and that is the format
# already on deployed machines' flash.
sequential-storage = "8.0.1"
serde = { version = "1.0.229", default-features = false }

# Core no-std libraries
bitvec = { version = "1.1.1", default-features = false }
byteorder = { version = "1.5.0", default-features = false }
cfg-if = "1.0.4"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = { version = "0.10.4", default-features = false }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
# 0.6 renamed `Heap` to `LlffHeap` and gated it behind `llff`; `tlsf` is a
# second allocator we don't use, so keep it out rather than compiling rlsf.
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
# 1.30.0, not 1.31.0: 1.31 requires rustc 1.93, which would falsify the
# `rust-version = "1.88"` above, and it only adds `unchecked_*` methods we do
# not use. 1.30 needs 1.85 and carries the changes that matter -- the
# readonly-statics bug fix (`compat-readonly-static`) and a formatting fix at
# defined precision. It is also where the `az ^1.3` requirement starts.
fixed = "~1.30"
heapless = "0.9.3"
micromath = "2.1.0"
movavg = { version = "2.5.0", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
paste = "1.0.15"
pio = "0.3.0"
portable-atomic = { version = "1.14", default-features = false }
static_cell = "2.1.1"
ux = "0.1.6"

# Async helpers
async-trait = "0.1.91"

# Proc-macro authoring, for variegated-postcard-schema-derive. These three move as a
# set -- syn is built on proc-macro2's token types, so mixing majors would put two
# incompatible `TokenStream`s in one macro.
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
# UI tests for the derive's serde-attribute rejection. That rejection is the whole
# anti-drift guarantee, so it is tested like one.
trybuild = "1.0"

[profile.dev]
debug = true              # Enable debug info
opt-level = 1           # Light optimization for better debugging
lto = true              # Disable link-time optimization

[profile.release]
debug = true             # Keep debug info in release builds too

# NOTE: the graph contains embassy-hal-internal 0.4.0 and 0.5.0 side by side.
# This is an upstream packaging bug: the *published* embassy-embedded-hal 0.6.0
# requires embassy-hal-internal "0.4.0", while the git tag it was cut from
# (embassy-embedded-hal-v0.6.0) correctly says "0.5.0" -- which is what
# embassy-rp 0.10.0 uses.
#
# Patching embassy-embedded-hal to that tag does NOT work in isolation: the git
# crate resolves its siblings by path, dragging in embassy-time from git, whose
# embassy-time-driver declares `links = "embassy-time"`. Only one package in a
# graph may claim a given `links` value, so it collides with the crates.io
# embassy-time-driver that embassy-rp depends on. Fixing it that way means
# sourcing the *entire* embassy family from git, trading a harmless duplicate
# for a large git-sourced dependency surface.
#
# Left alone deliberately, because the duplicate is inert: embassy-embedded-hal
# touches embassy-hal-internal in exactly one place -- `drop::OnDrop`, an RAII
# guard used inside two function bodies in shared_bus/asynch/spi.rs. It appears
# in no signature, and `SetConfig`/`GetConfig` are defined in
# embassy-embedded-hal itself, so no type crosses between the two versions.
# The cost is compiling one small extra crate. Revisit if upstream publishes a
# fixed embassy-embedded-hal.
#
# NOTE: the embassy-rp [patch.crates-io] fork (variegated-coffee/embassy, branch
# psram-0.8.0) was removed here. It existed only because `psram`/`qmi_cs1` were
# merged upstream but not yet published; its single commit just stripped
# `path = "../..."` from embassy-rp's dependencies so the crate could be consumed
# as a standalone git dep. There were no functional changes to carry over.
# Both modules ship in released embassy-rp since 0.9.0.