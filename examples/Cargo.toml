[package]
name = "examples"
version = "0.1.0"
edition = "2024"
default-run = "dual_boiler"

[[bin]]
name = "dual_boiler"
path = "dual-boiler/src/main.rs"
required-features = ["dual-boiler"]
test = false
bench = false

[[bin]]
name = "single_boiler"
path = "single-boiler/src/main.rs"
required-features = ["single-boiler"]
test = false
bench = false

[dependencies]
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "task-arena-size-65536"] }
embassy-rp = { version = "0.6.0", path = "../../../embassy/embassy-rp", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb"] }
embassy-sync = { version = "0.7.0", features = ["defmt"] }
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures = "0.1.1"

w25q32jv = { version = "0.5.1", features = ["defmt", "async", "megabits64"] }

defmt = "0.3"
defmt-rtt = "0.4"

embedded-alloc = { version = "0.5.1" }
ds3231 = { version = "0.3.0", features = ["async"] }

static_cell = "2"

cortex-m-rt = { version = "0.7.5", features = ["paint-stack"] }
panic-probe = { version = "0.3", features = ["print-defmt"] }

num-traits = { version ="0.2.19", default-features = false, features = ["libm"] }

variegated-board-cfg = { version = "0.2.1", path = "../../variegated-board/variegated-board-cfg" }

variegated-hal = { version = "0.1.0", path = "../variegated-hal", features = ["rp235xb"] }

variegated-ads124s08 = { version = "0.1.0", path = "../variegated-ads124s08", features = ["defmt"] }
variegated-fdc1004 = { version = "0.1.0", path = "../variegated-fdc1004", features = ["defmt"] }
variegated-mcp9600 = { version = "0.1.0", path = "../variegated-mcp9600", features = ["defmt"] }
variegated-gravity-driver = { version = "0.1.0", path = "../variegated-gravity-driver", features = ["defmt"], optional = true }
variegated-adc-tools = { version = "0.1.0", path = "../variegated-adc-tools" }
variegated-controller-lib = { version = "0.1.0", path = "../variegated-controller-lib", features = ["rp235xb"] }
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types" }
variegated-instrumentation = { version = "0.1.0", path = "../variegated-instrumentation"}
variegated-mcp23017 = { version = "0.1.0", path = "../variegated-mcp23017", features = ["defmt"] }
variegated-tlc59108 = { version = "0.1.0", path = "../variegated-tlc59108", features = ["defmt"] }
variegated-nv3007 = { version = "0.1.0", path = "../variegated-nv3007", features = ["defmt", "graphics", "delta-updates"], optional = true, default-features = false }
variegated-comms = { version = "0.1.0", path = "../variegated-comms" }
variegated-timekeeping = { version = "0.1.0", path = "../variegated-timekeeping", features = ["defmt"] }

rotary-encoder-hal = { version = "0.6.0", features = ["table-decoder"] }
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-graphics = "0.8.1"
embedded-graphics-core = "0.4.0"
display-interface = "0.5.0"
display-interface-spi = { version = "0.5.0", optional = true }
oled_async = { version = "0.1.0-alpha1", optional = true }
u8g2-fonts = { version = "0.7.2", optional = true }
hd44780-controller = { version = "0.1.0-alpha.2", features = ["async"] }
heapless = "0.8.0"

chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false }

serde = { version = "1.0.219", default-features = false, features = ["derive"] }
postcard = { version = "1.1.1", features = ["alloc"] }

futures = { version = "0.3.30", default-features = false, features = ["alloc"] }

[features]
default = ["rp235xb"]
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]
dual-boiler = ["tft-display", "gravity"]
single-boiler = ["dep:oled_async"]
tft-display = ["dep:variegated-nv3007", "dep:display-interface-spi", "dep:u8g2-fonts"]
gravity = ["dep:variegated-gravity-driver"]

[profile.dev]
debug = true              # Enable debug info
opt-level = 2            # Light optimization for better debugging
lto = false              # Disable link-time optimization
codegen-units = 1        # Better debug info

[profile.release]
debug = true             # Keep debug info in release builds too