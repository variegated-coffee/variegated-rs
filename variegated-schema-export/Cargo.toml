[package]
name = "variegated-schema-export"
version = "0.1.0"
edition = "2024"

# Its own workspace root, deliberately.
#
# This is a std host tool sitting inside a workspace whose members are all bare-metal --
# thumbv8m.main-none-eabihf for the espresso firmwares, riscv32imac-unknown-none-elf for
# the comms one. Adopted as a member it would be built for whichever of those is current
# and fail for want of std. An empty `[workspace]` table stops cargo adopting it when
# `variegated-comms-firmware` path-depends on it, and being a *build*-dependency is what
# then gets it compiled as a host unit with std. Both halves are needed.
[workspace]

[lib]
bench = false

[[bin]]
name = "variegated-schema-export"
path = "src/main.rs"

[dependencies]
variegated-postcard-schema = { path = "../variegated-postcard-schema", features = ["heapless", "chrono"] }
variegated-controller-types = { path = "../variegated-controller-types", default-features = false, features = ["schema", "std"] }
variegated-comms-api-types = { path = "../variegated-comms-api-types", features = ["schema"] }
# For the fixtures only: `PidOut`'s fields and `Limits::new_with_limits`, which the
# controller-types aliases do not re-export.
variegated-control-algorithm = { path = "../variegated-control-algorithm", features = ["serde"] }
# Fixtures are serialized both ways: postcard for the bytes the decoder must reproduce,
# and JSON as the independent reference for field names and structure.
# `use-crc` is for the shot log fixture only. A stored shot is
# `postcard::to_allocvec_crc32(&ShotLog)` -- the encoding followed by a CRC-32/ISCSI
# trailer -- so a fixture without the trailer would be in a format no machine produces,
# and the decoder it is meant to test would rightly refuse it.
postcard = { version = "1.1.3", features = ["alloc", "use-crc"] }
crc = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
heapless = { version = "0.9.3", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
