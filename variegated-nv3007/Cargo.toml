[package]
name = "variegated-nv3007"
version = "0.1.0"
edition = "2021"
description = "Async driver for the NV3007 TFT LCD controller with embedded-graphics support"
repository = "https://github.com/variegated-coffee/variegated-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "async", "nv3007", "display", "graphics"]
categories = ["embedded", "hardware-support", "no-std", "graphics"]

[lib]
test = false
bench = false

[features]
default = ["graphics", "delta-updates"]
graphics = ["embedded-graphics-core"]
delta-updates = []
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
display-interface = "0.5"
embassy-time = "0.5"
embassy-sync = "0.7.2"
heapless = "0.8"
defmt = { version = "0.3", optional = true }
embedded-graphics-core = { version = "0.4", optional = true }
variegated-instrumentation = { version = "0.1.0", path = "../variegated-instrumentation" }

[dev-dependencies]
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.8.0", features = ["defmt", "time-driver", "rp235xb"] }
display-interface-spi = "0.5"
cortex-m-rt = "0.7.0"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-graphics = "0.8"