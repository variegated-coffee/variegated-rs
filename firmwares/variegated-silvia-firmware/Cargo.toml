[package]
name = "variegated-silvia-firmware"
version = "0.1.0"
edition = "2024"

# Spelled out rather than left to auto-detection, so `test`/`bench` can be turned off:
# an auto-detected bin defaults to `test = true`, and building a test harness for a
# `no_std` binary does not end well.
[[bin]]
name = "variegated-silvia-firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xb"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-embedded-hal = { workspace = true, features = ["defmt", "time"] }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-futures.workspace = true

w25q32jv = { version = "0.5.1", features = ["defmt", "async", "megabits64"] }

defmt.workspace = true
defmt-rtt.workspace = true
# `log_*!` expands to a `log::*!` call as well as a `defmt::*!` one, so the facade
# has to be nameable from this crate.
log.workspace = true

embedded-alloc.workspace = true

static_cell.workspace = true

cortex-m-rt = { workspace = true, features = ["paint-stack"] }
panic-probe = { workspace = true, features = ["print-defmt"] }

num-traits = { workspace = true, features = ["libm"] }

variegated-board-cfg = { version = "0.3.0", path = "../../crates/variegated-board-cfg" }

variegated-hal = { version = "0.1.0", path = "../../crates/variegated-hal", features = ["rp235xb", "atomic-mutex"] }

variegated-ads124s08 = { version = "0.1.0", path = "../../crates/variegated-ads124s08", features = ["defmt"] }
variegated-fdc1004 = { version = "0.1.0", path = "../../crates/variegated-fdc1004", features = ["defmt"] }
variegated-mcp9600 = { version = "0.1.0", path = "../../crates/variegated-mcp9600", features = ["defmt"] }
variegated-gravity-driver = { version = "0.1.0", path = "../../crates/variegated-gravity-driver", features = ["defmt"], optional = true }
variegated-adc-tools = { version = "0.1.0", path = "../../crates/variegated-adc-tools" }
variegated-controller-lib = { version = "0.1.0", path = "../../crates/variegated-controller-lib" }
variegated-controller-types = { version = "0.1.0", path = "../../crates/variegated-controller-types" }
variegated-menu = { version = "0.1.0", path = "../../crates/variegated-menu", features = ["defmt"] }
variegated-machine-menu = { version = "0.1.0", path = "../../crates/variegated-machine-menu", features = ["defmt"] }
variegated-instrumentation = { version = "0.1.0", path = "../../crates/variegated-instrumentation", features = ["instrumentation"] }
variegated-checkin = { version = "0.1.0", path = "../../crates/variegated-checkin", features = ["defmt"] }
variegated-debug = { version = "0.1.0", path = "../../crates/variegated-debug", features = ["usb-cdc-rp", "instrumentation", "defmt", "source-application", "rp235xb"] }
variegated-comms = { version = "0.1.0", path = "../../crates/variegated-comms" }
# `debug-bus` installs the `log` -> debug bus bridge; see `bus_sink::init()` in main.
variegated-log = { version = "0.1.0", path = "../../crates/variegated-log", features = ["debug-bus", "rp235xb"] }
# `named-timezones` for the GS3's reason -- see that manifest. This board has no scheduler, so
# the zone reaches only its clock display and the browser, but a machine whose clock reads UTC
# while the other's reads local would be a difference with nothing behind it.
variegated-timekeeping = { version = "0.1.0", path = "../../crates/variegated-timekeeping", features = ["defmt", "named-timezones"] }

rotary-encoder-hal = { version = "0.6.0", features = ["table-decoder"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-graphics.workspace = true
embedded-graphics-core.workspace = true
# Not optional here, unlike on the GS3 where it arrives via `tft-display`: the SSD1309 is
# the only display this machine has.
display-interface-spi = { workspace = true }
oled_async = { version = "0.2.1" }
heapless.workspace = true

chrono = { workspace = true, features = ["alloc"] }

postcard = { workspace = true, features = ["alloc"] }

futures = { version = "0.3.33", default-features = false, features = ["alloc"] }


[features]
# One crate, one machine: `default` *is* this machine's configuration, so a plain
# `cargo build` produces the firmware. There is no umbrella feature selecting the machine.
# `sd-card-pio-spi-trace` is in here **temporarily**, while the card is being brought up on
# hardware. It implies `sd-card-pio-spi`. Take it out once the card identifies reliably: it
# logs every command, response and data token, which is thousands of lines per filesystem
# operation and will bury anything else on the debug link.
default = ["rp235xb", "gravity", "sd-card-pio-spi-trace"]
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "variegated-controller-lib/rp235xb"]
gravity = ["dep:variegated-gravity-driver"]
# The SD shot log, in **SPI mode** on a PIO SPI master. Both of this board's SPI peripherals
# are taken -- SPI0 the display, SPI1 the internal ADC bus -- which is why the card cannot
# use `sd-card-storage` the way the GS3's does, and why the master is PIO.
#
# Nothing here names `sdio`, `exfat-slim` or `variegated-pio-mmc-bus`:
# `variegated-controller-lib`'s `sd_card_pio_spi` module is the whole interface, and it takes
# raw pins for exactly that reason. In `default` because the board has the slot.
sd-card-pio-spi = ["variegated-controller-lib/sd-card-pio-spi"]
# Bring-up tracing, off by default. `sdio`'s half is the useful one: every command frame,
# every R1 with its idle-byte count, every data token, and a marker naming the patched fork
# -- which is what tells "the firmware is not running the fork" apart from "the card is not
# answering".
sd-card-pio-spi-trace = [
    "sd-card-pio-spi",
    "variegated-controller-lib/sd-card-pio-spi-trace",
]

# The 4-bit native transport, kept buildable but no longer wired to this board.
#
# It never brought a card up here and its bring-up is unfinished; SPI mode is the supported
# path. Retained rather than deleted because it is the only route to the card's full 4-bit
# bandwidth if it is ever made to work, and because its 45 host tests still run. Selecting it
# requires editing `board-cfg.toml` back to the six-pin native pinout -- the two transports
# want the same slot and the same PIO block.
sd-card-pio = ["variegated-controller-lib/sd-card-pio"]
sd-card-pio-trace = ["sd-card-pio", "variegated-controller-lib/sd-card-pio-trace"]
