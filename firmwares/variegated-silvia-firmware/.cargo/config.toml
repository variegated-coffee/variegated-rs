[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# `probe-runner.sh` wraps probe-rs, which flashes over SWD and gives defmt output and a
# stack unwind on panic. The link args this target needs are emitted by `build.rs` as
# `cargo:rustc-link-arg-bins`, not set here.
runner = "./probe-runner.sh"

[target.'cfg(test)']
rustflags = ["--cfg", "test"]

[alias]
test-aarch64 = "test --target aarch64-apple-darwin"  # Run tests with this target

# NOTE: this `rustflags` key is inside the `[alias]` table above, so cargo reads it as an
# alias named `rustflags` and these two flags are NOT applied to any build. Moving it under
# a `[build]` or `[target.…]` table would change codegen for this firmware, so it is left
# as-is pending a deliberate decision rather than silently switched on.
rustflags = [
    "-C", "inline-threshold=5",
    "-C", "no-vectorize-loops",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "debug"
EMBASSY_EXECUTOR_TASK_ARENA_SIZE="262144"