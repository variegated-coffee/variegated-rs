[package]
edition      = "2024"
name         = "variegated-comms-firmware"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "variegated-comms-firmware"
path = "./src/bin/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[lib]
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

# Generates frontend/src/schemas/schemas.ts during the build, so it cannot drift from
# the Rust types.
#
# A build-dependency, not a normal one. Cargo compiles build dependencies as *host*
# units, so this gets std and escapes the riscv default target and `-Z build-std` that
# `.cargo/config.toml` imposes on everything else here. Resolver 2 (see the workspace
# manifest) is what keeps the two feature universes apart: this pulls
# variegated-controller-types with `std` + `schema`, while the normal dependency below
# stays `no_std`. Under resolver 1 those would unify and `std` would leak into the
# firmware.
[build-dependencies]
variegated-schema-export = { path = "../../crates/variegated-schema-export" }

[dependencies]
# `derive` is what `#[gatt_service]`/`#[gatt_server]` live behind. Those macros are
# invoked in `variegated-improv-trouble`, not here -- see that crate's manifest for the
# embassy-sync version reason -- and cargo would unify the feature in from there anyway.
# It is named here because this is the binary that needs it, and a feature list that omits
# it would read as "this firmware has no GATT server".
trouble-host = { workspace = true, features = ["gatt", "derive", "default-packet-pool", "default-packet-pool-mtu-255", "default-packet-pool-size-16", "peripheral", "central", "scan", "defmt", "gatt-client-notification-queue-size-8", "l2cap-rx-queue-size-8"] }
# Improv Wi-Fi provisioning. `ble` brings in the GATT service and the run loop; without it
# this crate is just the packet codec, which is how its host tests stay runnable.
variegated-improv-trouble = { path = "../../crates/variegated-improv-trouble", features = ["ble"] }
variegated-comms-api-types = { path = "../../crates/variegated-comms-api-types" }
variegated-trouble-connection-manager = { path = "../../crates/variegated-trouble-connection-manager" }
variegated-belka-portal-trouble-driver = { path = "../../crates/variegated-belka-portal-trouble-driver" }
variegated-scale-trouble-driver = { path = "../../crates/variegated-scale-trouble-driver" }
variegated-controller-types = { path = "../../crates/variegated-controller-types", default-features = false, features = ["serde", "defmt"] }
# The *same* crate the application processor uses, not a second bus. Both
# workspaces declare `embassy-sync = "0.8.0"` and `embassy-time = "0.5.1"`, so
# `variegated_debug::bus`'s channel types are the same types on both processors
# and the sequence numbering, drop accounting and non-blocking publish contract
# cannot drift apart.
#
# `source-comms` stamps every frame this firmware emits with `DebugSource::Comms`;
# enabling both source features, or neither, is a `compile_error!`. `usb-cdc-rp`
# stays off: that transport is embassy-rp and RP2350-only, and embassy-rp cannot
# build for riscv32 at all.
#
# `instrumentation` is what makes `variegated_debug::sampler` carry real values:
# without it `PerformanceCounters`/`PerformanceIndicators` resolve to the no-op
# implementations and every sample publishes zero. It forwards to
# `variegated-instrumentation/instrumentation`, and cargo unifies that with the
# direct dependency below, so the two cannot end up disagreeing about which
# implementation is linked.
variegated-debug = { path = "../../crates/variegated-debug", default-features = false, features = ["source-comms", "defmt", "instrumentation"] }
variegated-debug-codec = { path = "../../crates/variegated-debug-codec", default-features = false, features = ["defmt"] }
# Direct, rather than leaning on the re-export path through `variegated-debug`:
# `define_counters!`/`define_indicators!` expand to `$crate::…` paths that only
# resolve if the crate is nameable here.
variegated-instrumentation = { path = "../../crates/variegated-instrumentation", features = ["instrumentation"] }
variegated-checkin = { path = "../../crates/variegated-checkin", features = ["defmt"] }
# For `ConversionParameters`' median and Kalman filters, which smooth the gravimetric
# flow rate derived in `ble::devices`. Nothing here converts an ADC count -- the crate
# is named for its main use on the application processor, but the filters are the
# portable part of it: `#![no_std]`, `micromath` + `heapless` only, no embassy and
# nothing RP2350-specific. Both workspaces pin `heapless 0.9.3`, so it unifies; this is
# what pulls `micromath` into this graph for the first time.
variegated-adc-tools = { path = "../../crates/variegated-adc-tools" }
bt-hci.workspace = true
postcard = { workspace = true, features = ["alloc", "use-crc"] }
serde = { workspace = true, features = ["derive", "alloc"] }
embassy-sync = { workspace = true, features = ["defmt"] }
portable-atomic = { workspace = true, features = ["critical-section"] }
heapless.workspace = true
embassy-futures.workspace = true
embassy-executor = { workspace = true, features = ["defmt"] }
embassy-net = { workspace = true, features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-time = { workspace = true, features = ["defmt"] }
# For `net_probe`'s counting wrapper around the Wi-Fi driver. Pinned to the version
# embassy-net 0.9 itself depends on -- the wrapper has to implement the *same* `Driver`
# trait embassy-net consumes, so a second copy of the crate would not type-check.
embassy-net-driver = "0.2.0"
edge-net = { workspace = true, features = ["embassy", "defmt", "io"] }
edge-http.workspace = true
edge-ws.workspace = true
edge-nal.workspace = true
edge-nal-embassy = { workspace = true, features = ["tcp"] }
# TLS for shot-log upload, with real X.509 verification.
#
# # This forces MbedTLS to be built from source, and that is not a preference
#
# `mbedtls-rs-sys` ships prebuilt `.a`s for `riscv32imac-unknown-none-elf`, but they are
# compiled with `#undef MBEDTLS_HAVE_TIME` and `#undef MBEDTLS_HAVE_TIME_DATE`. X.509
# `notBefore`/`notAfter` checking needs both, so `hook-wall-clock` rejects the prebuilt set
# and rebuilds. The build therefore needs cmake, ninja and a clang that can target riscv32
# -- Apple's cannot, so `CC_riscv32imac_unknown_none_elf` must point at Homebrew's LLVM (or
# enable `use-gcc` + `force-esp-riscv-gcc`). See `scripts/build-comms-firmware.sh`.
#
# That would be a poor trade on its own. It is not a trade, because the buffers below
# require the same rebuild:
#
# # The record buffers, which are the reason any of this fits
#
# `MBEDTLS_SSL_VARIABLE_BUFFER_LENGTH` is not defined, so `mbedtls_ssl_setup` allocates
# `IN` and `OUT` in full for the life of the session and never shrinks them. At the `tls`
# bundle's 16384 defaults that is 16765 + 16765 = **33530 bytes per connection**, against a
# heap with ~40 kB spare (see the block above `heap_allocator!` in `bin/main.rs`). It does
# not fit, and `mbedtls-rs` exposes no way to reach `mbedtls_ssl_conf_max_frag_len`, so RFC
# 6066 cannot rescue it either.
#
# Curated, at 4096/1024, the same arithmetic gives **4128 + 1056 = 5184**. Some of that
# comes from the feature list rather than the sizes: dropping `cipher-mode-cbc` takes
# `MBEDTLS_SSL_PADDING_ADD` 256 -> 0 and `MAC_ADD` 48 -> 16, and dropping `tls-proto-dtls`
# takes the CID expansion to 0.
#
# # Why 4096 in, and the measurement behind it
#
# `IN` has to hold the server's entire `Certificate` handshake message in one buffer, so it
# is bounded by the chain, not by a preference. This started at 8192 against a guess that a
# three-cert RSA-2048 chain runs 4-5 kB. Measured against the real endpoint it is three
# certs and ~2610 DER bytes, because the chain is ECDSA throughout:
#
#   openssl s_client -connect plantlet.variegated.coffee:443 \
#       -servername plantlet.variegated.coffee -showcerts </dev/null
#
# 4096 therefore has ~1.4 kB of margin and buys back ~5 kB of heap, which is the resource
# that actually ran out: the first on-device run peaked at 122,456 of 122,880 with 424
# bytes to spare. **Re-measure the chain if the hosting changes** -- an RSA chain would be
# roughly double and would not fit.
#
# `OUT` is 1024 because the largest thing this firmware sends is a 1024-byte shot-log chunk,
# and the request head is under 512.
# Everything about uploading a shot that is not the chip: trust anchors, URL parsing, HTTP
# status policy, the TLS session configuration and request framing -- all host-tested, which
# nothing in *this* crate can be (`[lib] harness = false`). `tls` is what compiles its
# MbedTLS-dependent half; see that crate's Cargo.toml for why it is not on by default.
variegated-shot-upload = { path = "../../crates/variegated-shot-upload", features = ["tls", "defmt"] }
# Named here as well so this firmware can add the chip feature. `variegated-shot-upload`
# cannot: `esp32c6` pulls `esp-hal` and would stop that crate building for a host, which is
# the whole point of it. Cargo unifies the two into one feature set for this build.
mbedtls-rs = { workspace = true, features = [
    "ssl-in-content-len-4096", "ssl-out-content-len-1024",
    # X.509 validity dates. `hook-wall-clock` implies `hook-timer`. The clock is the
    # SNTP-synced one from `time.rs`; before the first sync the hook returns `None`, which
    # MbedTLS treats as both expired and not-yet-valid -- i.e. it fails closed.
    "hook-wall-clock",
    # Routes SHA-256/512 and modular exponentiation to the C6's accelerators. Not an
    # optimisation: without the `exp_mod` hook, verifying an RSA-4096 root is software
    # big-int on a 160 MHz core inside a single call with no yield point, which is an
    # executor stall long enough to trip `watchdog.rs`.
    "esp32c6", "embassy-time",
    # On top of the non-negotiable floor (TLS 1.2+1.3, ECDHE-ECDSA, SHA-256, AES-GCM,
    # HKDF, ECP/ECDH/ECDSA, PK, secp256r1, CTR-DRBG, entropy, base64, PEM, X.509 parse):
    "alg-sha512",                # SHA-384, for AES-256-GCM-SHA384 and P-384 signatures
    "alg-rsa", "alg-rsa-pss",    # RSA certificate chains; PSS is mandatory in TLS 1.3
    "kex-ecdhe-rsa",             # TLS 1.2 against an RSA certificate
    "curve-secp384r1",           # ISRG Root X2, GTS Root R4
    "defmt",
] }
embedded-io.workspace = true
embedded-io-async.workspace = true
esp-alloc.workspace = true
# No `panic-handler`, and no `println`: this crate is used for `Backtrace::capture()`
# and nothing else. Its own handler routes every line through `esp_println::println!`,
# which is `no-op` in this build (see below), so keeping it would have meant a panic
# handler that formats a backtrace and writes it to a function with an empty body.
# `main.rs` has the `#[panic_handler]` instead, and `debug/panic_console.rs` writes
# the bytes; that is the only way the backtrace reaches a wire while esp-println has
# no output target.
#
# `defmt` is not a choice, it is a tax: esp-backtrace's build script refuses to build
# with neither `defmt` nor `println`, even though both only feed macros that live
# behind `panic-handler`. `defmt` is the harmless one of the two -- it expands to a
# `use defmt as _;` in a build that already links defmt, where `println` would drag in
# an `esp-println` whose output target this firmware has deliberately removed.
#
# The default `colors` comes along and is likewise inert: its only use site is behind
# `all(feature = "colors", feature = "println")`. Just as well -- the escape sequences
# it emits are exactly what the host's text classifier refuses, so a build that used
# them would make the panic path unreadable in the name of making it prettier.
esp-backtrace = { workspace = true, features = ["defmt"] }
esp-bootloader-esp-idf.workspace = true
esp-hal = { workspace = true, features = ["defmt", "unstable"] }
# `jtag-serial`: defmt output goes to the USB-Serial-JTAG. This is what makes
# `defmt::unwrap!`/`assert!`/`panic!` text visible at all -- handed to a logger with no
# sink, a failing assertion surfaces only as `core::panic!()` from
# `__defmt_default_panic`, i.e. the string `explicit panic` and nothing else.
#
# The two targets NOT chosen, and why:
#
#   * `auto` probes for USB-Serial-JTAG at runtime, watching the peripheral's SOF
#     interrupt flag. There is nothing to probe *for* -- this firmware knows which
#     peripheral it wants, so it names it.
#   * `uart` does not write to a UART peripheral. On the C6 it calls ROM `tx_one_char`
#     and flushes via `tx_flush(get_channel())`, i.e. the *ROM console channel*, which
#     on a chip attached over native USB is the USB-Serial-JTAG anyway. Worse, it
#     flushes every 32 bytes while holding `esp_sync::RawMutex` -- ~2.8 ms of busy-wait
#     per chunk at 115200 **with interrupts disabled**, on a processor running Wi-Fi and
#     BLE, with no timeout.
#
# `jtag-serial` is bounded where `uart` is not. `wait_for_flush` spins at most
# `TIMEOUT_ITERATIONS = 50_000` and then latches a sticky `TIMED_OUT`, after which every
# further write returns immediately without touching the FIFO. So the cost with no host
# attached decays to nothing, and the worst case with one attached is a bounded spin
# only when the FIFO is genuinely full.
#
# The cost of having an output target at all: `variegated-log`'s `log_*!` macros
# dual-emit to defmt and to the `log` facade, so normal logging reaches *both* the debug
# bus and this wire. If that duplication becomes a problem, make the dual-emit
# conditional rather than blinding defmt again.
#
# **`critical-section` is not a nicety here, it is the load-bearing half of this line.**
# In `esp-println/src/defmt.rs` the lock, the `TAKEN` re-entrancy check and `CS_RESTORE`
# are all `#[cfg(feature = "critical-section")]`. The line after them is not:
#
#     unsafe { ENCODER.start_frame(do_write) }
#
# `ENCODER` is a single `static mut defmt::Encoder`. Without the feature, every
# `defmt::*!` call from any task or interrupt mutates it with no mutual exclusion. The
# symptom is a panic reading exactly `explicit panic`, at random moments under logging
# load, when the corrupted encoder trips one of defmt's internal assertions -- and the
# assertion text then goes to the same broken logger and vanishes.
#
# Selecting the `no-op` output target does **not** save you from that: it only makes
# `do_write` empty, while `acquire()` still runs and still drives the encoder. All of the
# hazard, none of the benefit. So if this firmware ever goes back to `no-op`, **keep
# `critical-section`**. The output target is a choice; the lock is not.
#
# `timestamp` keeps `_esp_println_timestamp` in main.rs a live export.
esp-println = { workspace = true, default-features = false, features = ["jtag-serial", "critical-section", "defmt-espflash", "timestamp", "esp32c6"] }
# The `log_*!` macros and the `log` -> debug-bus sink, the same crate and the same
# `debug-bus` feature the application processor uses. `bus_sink` formats each
# record into a fixed `heapless::String<96>` and runs it past
# `variegated_debug::suppress`, so a chatty task cannot empty the 16-slot ring.
#
# No chip feature is named, and that is the point: `rp2040`/`rp235xa`/`rp235xb`
# are what pull in `embassy-rp`, `embassy-usb-logger` and `defmt-rtt`, none of
# which build for riscv32 -- and `defmt-rtt` would additionally collide with
# `esp-println`'s `#[defmt::global_logger]`.
#
# `defmt` **is** named, and must stay named. It is a default feature of that crate, and
# this line passes `default-features = false` -- so dropping it would silently switch the
# defmt half of every `log_*!` back off, leaving assertions invisible exactly as the
# esp-println block above describes. It is a feature at all so that *host* test builds
# can turn it off.
variegated-log = { path = "../../crates/variegated-log", default-features = false, features = ["debug-bus", "defmt"] }
esp-rtos = { workspace = true, features = ["esp-radio", "defmt", "embassy"] }
static_cell.workspace = true
# No `smoltcp` feature: esp-radio offers no blocking smoltcp path, and embassy-net/async
# is what this firmware uses regardless.
esp-radio = { workspace = true, features = [
  "ble",
  "coex",
  "defmt",
  "unstable",
  "wifi",
] }
smoltcp = { workspace = true, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
] }
defmt.workspace = true
# sntpc bundles no embassy socket integration, so `NtpUdpSocket` is implemented on our
# side -- see src/time.rs.
sntpc = { workspace = true, features = ["defmt"] }
jiff = { workspace = true, features = ["static"] }
log.workspace = true
esphome-device = { path = "../../../esphome-device-rs", default-features = false, features = ["embassy_net", "defmt"] }

[features]
default = [
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-radio/esp32c6",
#  "insecure-tls"
]

# **Builds a firmware that does not check the upload endpoint's certificate.**
#
#     cargo build --profile comms-release --features insecure-tls
#
# A debugging build and never a shipping one. It exists to answer one question -- is a
# certificate the *only* thing wrong -- when a handshake fails with `BADCERT_NOT_TRUSTED`
# and `mbedtls-rs`'s safe API gives no way to look at the chain the server actually sent.
#
# It is not quiet: `upload::attempt_upload` logs a warning naming the flags verification
# *would* have produced at every handshake, because a machine that is not checking
# certificates should be obvious from thirty seconds of log.
#
# A feature rather than a runtime flag for the reason `config::TCP_COMMANDS_ENABLED` gives
# at length: `VERIFIES_CERTIFICATES` is a `const bool`, so with the feature off the warning
# branch is `if false` and folds away, and `AuthMode::None` is behind a `cfg` and never
# compiled. There is nothing on the other side of it for a stray write to reach.
#
# One thing that looks like a counter-example and is not: `strings` finds "VERIFICATION IS
# DISABLED" in a default build. That is defmt's interning table in `.defmt`, which sits at
# VMA 0 and is not a loaded section -- the text costs no flash and the code that would log
# it is gone. Check `llvm-objdump -h` before concluding otherwise.
insecure-tls = ["variegated-shot-upload/danger-skip-verification"]

