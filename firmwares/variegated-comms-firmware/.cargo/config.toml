[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c6 --log-format defmt --output-format oneline"

[env]
DEFMT_LOG="info"
VARIEGATED_DEBUG_ALLOW_TCP_COMMANDS = "1"

# The C compiler MbedTLS is built with, and without this the build does not work on macOS
# at all.
#
# `mbedtls-rs-sys` compiles MbedTLS from source here rather than using its prebuilt
# `riscv32imac-unknown-none-elf` archives, because those are built `#undef
# MBEDTLS_HAVE_TIME` and the `hook-wall-clock` feature -- X.509 validity dates -- rejects
# them. See the `mbedtls-rs` entry in this crate's Cargo.toml for the whole argument.
#
# Its cmake invocation passes `-DCMAKE_C_COMPILER` and resolves the bare name `clang` from
# `PATH` unless `CLANG_PATH` is set (`gen/builder.rs:694`). **Apple's `/usr/bin/clang` has
# no RISC-V backend**, so it resolves, compiles nothing, and fails cmake's compiler probe
# with `No available targets are compatible with triple "riscv32-unknown-unknown"` -- which
# names neither clang nor the reason.
#
# An env var here rather than telling everyone to prefix `PATH`, because this reaches every
# caller the same way: `cargo build`, `scripts/cargo.sh`, `scripts/build-comms-firmware.sh`
# and RustRover's Cargo run configurations all get it without any per-tool setup.
#
# Cargo's `[env]` does not override a variable already in the environment, so this is a
# default rather than a policy: `export CLANG_PATH=/usr/local/opt/llvm/bin/clang` on an
# Intel Mac, or a distro path on Linux, and that wins. Any clang with the RISC-V target
# built in will do -- check with
# `<clang> --print-targets | grep riscv32`.
CLANG_PATH = "/opt/homebrew/opt/llvm/bin/clang"

# Let smoltcp drain the whole RX queue in one poll instead of three packets at a time.
#
# esp-radio reports this as embassy-net's `max_burst_size` capability, and 0 is the
# documented way to say "no limit" (wifi/mod.rs:1856 maps 0 to `None`). The default is 3.
#
# Three is a latch rather than a throttle here, because of how the wake works. Packets
# reach `DATA_QUEUE_RX_STA` from `recv_cb_sta`, which fires embassy-net's receive waker
# on *arrival*. The driver's `receive()` re-registers that waker on every call, but
# nothing re-fires it merely because the queue is still non-empty -- so once smoltcp has
# taken its three and returned, whatever is left waits for the next packet to arrive or
# for smoltcp's poll timer, seconds away.
#
# That is why raising `rx_queue_size` off 5 only half-worked: it stopped the drops, so
# the SYN ladder shortened and `connect` went from 6.5 s to 3.7 s, but it made the
# backlog deeper while still draining it three at a time, and time-to-first-byte stayed
# pinned at ten seconds. The request packet was queued behind a backlog, not lost.
ESP_RADIO_CONFIG_WIFI_MAX_BURST_SIZE = "0"

[build]
# `-Tlinkall.x` is not set here: `build.rs` emits it as a `rustc-link-arg`.
rustflags = [
  "-C", "force-frame-pointers",
]

target = "riscv32imac-unknown-none-elf"

[unstable]
build-std = ["alloc", "core"]
