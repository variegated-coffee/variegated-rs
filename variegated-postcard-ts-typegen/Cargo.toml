[package]
name = "variegated-postcard-ts-typegen"
version = "0.1.0"
edition = "2024"
authors = ["Variegated Coffee <support@variegated.coffee>"]
license = "MIT OR Apache-2.0"
description = "Generate TypeScript Postcard schemas from Rust types"
repository = "https://github.com/variegated-coffee/variegated-rs"
keywords = ["typescript", "postcard", "serialization", "codegen"]
categories = ["development-tools", "encoding"]

[dependencies]
variegated-postcard-ts-typegen-derive = { version = "0.1.0", path = "../variegated-postcard-ts-typegen-derive" }
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
heapless = { version = "0.8.0", optional = true }

[features]
heapless = ["dep:heapless"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
heapless = "0.8.0"
