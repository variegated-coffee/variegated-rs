[package]
name = "variegated-ulanzi-codec"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `default-features = false` for the reason `variegated-machine-menu` does it: the default
# set turns on defmt, whose `links = "defmt"` build script a host test binary cannot
# satisfy, and the failure reads "Too many sections!" without mentioning defmt.
variegated-controller-types = { path = "../variegated-controller-types", default-features = false }
heapless = { workspace = true }
# Optional on purpose. `variegated-ulanzi-trouble-driver` will take defmt unconditionally,
# which is one of the reasons that crate cannot host a test binary; repeating it here would
# defeat the point of splitting the codec out. See `variegated-scale-codec`.
defmt = { workspace = true, optional = true }

[features]
default = []
defmt = ["dep:defmt", "variegated-controller-types/defmt"]
# Nothing here needs `std`; the feature exists so the host gate can name this crate
# uniformly with the other codec crates.
std = []
