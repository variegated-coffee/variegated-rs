[package]
name = "variegated-timekeeping"
version = "0.1.0"
edition = "2024"
description = "Date and time handling for embedded espresso machine controllers"
repository = "https://github.com/variegated-coffee/variegated-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "async", "datetime", "timezone"]
categories = ["embedded", "date-and-time", "no-std"]

[lib]
test = false
bench = false

[features]
default = []
named-timezones = ["dep:chrono-tz"]
defmt = ["dep:defmt", "embassy-time/defmt", "embassy-sync/defmt"]
serde = ["chrono/serde"]

[dependencies]
embassy-time.workspace = true
embassy-sync.workspace = true
chrono = { workspace = true, features = ["alloc"] }
chrono-tz = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "time-driver", "rp235xb"] }
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe = { workspace = true, features = ["print-defmt"] }