[package]
name = "variegated-debug-codec"
version = "0.1.0"
edition = "2024"

[dependencies]
# Plain workspace inheritance, no `default-features` override: postcard's default
# feature is `heapless-cas` (heapless + its CAS support), which has nothing to do
# with alloc -- `alloc` is a separate opt-in postcard feature we don't enable
# either. This crate stays alloc-free because `to_slice_cobs` and the
# `accumulator` module are both unconditional, not because of this line.
postcard.workspace = true
# The envelope's version byte has to be read *before* postcard is handed anything,
# which means de-framing and deserialising can no longer be one step. postcard's
# `CobsAccumulator` does both at once and has no raw-bytes escape hatch, so the
# accumulator in `Decoder` is ours and the COBS half comes from here. Not a new
# dependency in practice: postcard already pulls in exactly this version.
# `default-features = false` because its default is `std`.
cobs = { version = "0.3.0", default-features = false }
serde = { workspace = true, default-features = false }
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false, features = ["serde", "double_boiler", "single_group"] }
defmt = { workspace = true, optional = true }

[features]
default = []
defmt = ["dep:defmt", "variegated-controller-types/defmt"]
# Host tests need serde's std impls for the `alloc` types in controller-types.
std = ["variegated-controller-types/std"]

[dev-dependencies]
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false, features = ["serde", "std", "double_boiler", "single_group"] }
# The test module builds a `heapless::Vec` directly (`debug::Vec` is a private
# import in `variegated-controller-types`, not re-exported), so it needs its own
# handle on the crate. Version comes from the workspace pin used everywhere else.
heapless.workspace = true
# Same reason, for the worst-case `Status` fixture: `Output::PidOutput` wraps a
# `PidOut<f32>` from the control-algorithm crate, and `Status::current_local_time` a
# `chrono::NaiveDateTime`. Neither is re-exported from controller-types.
variegated-control-algorithm = { version = "0.1.0", path = "../variegated-control-algorithm", features = ["serde"] }
chrono.workspace = true
