[package]
name         = "variegated-comms-api-types"
version      = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# The wire types the frontend talks to, split out of `variegated-comms-firmware`
# so they can be reached from a *host* build.
#
# The split is not cosmetic. `schemas.ts` is generated by an emitter that runs
# from the firmware's `build.rs`, and a package cannot be its own
# build-dependency -- so as long as `RoutineStorage`, `WsMessage` and the
# `Set*Request` types lived in the firmware crate, nothing could read their
# schemas at build time. They have no dependency on the firmware beyond serde
# and `variegated-controller-types`, so there is nothing to untangle.

[dependencies]
serde = { workspace = true, features = ["derive", "alloc"] }
variegated-controller-types = { path = "../../variegated-rs/variegated-controller-types", default-features = false, features = ["serde"] }
