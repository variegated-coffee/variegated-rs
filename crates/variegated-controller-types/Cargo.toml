[package]
name = "variegated-controller-types"
version = "0.1.0"
edition = "2024"

[lib]
# `test = true`, unlike this crate's neighbours, because `bluetooth::reconcile_bluetooth_slots`
# is pure logic whose two failure modes are silent: claims keyed on list position drop every
# peripheral's connection when one is deleted, and two associations sharing an address make
# each one's release tear down the other's link. Neither is reachable from a smoke test.
# Run on the host, and `--no-default-features` is not optional -- the default set pulls in
# defmt, whose `links = "defmt"` linker script a host test binary cannot satisfy, and which
# fails as "Too many sections!" rather than as anything mentioning defmt:
#
#   cargo test -p variegated-controller-types --target aarch64-apple-darwin \
#       --no-default-features --features std,serde
bench = false

[dependencies]
defmt = { workspace = true, optional = true }
heapless.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"], optional = true }
variegated-postcard-schema = { version = "0.1.0", path = "../variegated-postcard-schema", optional = true }
# `defmt` is inherited through this crate's own `defmt` feature rather than being
# hardcoded here. Hardcoding it put defmt into *every* graph that touches these types,
# including host builds -- and defmt declares `links = "defmt"` and emits `extern "Rust"`
# references to `_defmt_acquire`/`_defmt_write`/`_defmt_timestamp` with no provider, so a
# host binary that monomorphizes any `Format` impl fails to link. That matters now that
# the schema exporter runs as a build script.
variegated-control-algorithm = { version = "0.1.0", path = "../variegated-control-algorithm", default-features = false }
sequential-storage = { workspace = true, optional = true, features = ["defmt"] }
postcard = { workspace = true, optional = true, features = ["alloc", "use-crc"] }
crc = { workspace = true, optional = true }

[dev-dependencies]
# Not the same dependency as the optional `postcard` above, which is enabled only by
# `sequential-storage`. The prefix-decode contract in `shot_log.rs` is a statement about
# the *encoding* of `ShotLog`, so it has to encode one -- and it must hold regardless of
# which optional features a firmware build happens to turn on.
postcard = { workspace = true, features = ["alloc"] }

[features]
# `serde/alloc` is required, not optional: the derives in this crate cover types
# containing `alloc::vec::Vec` and `alloc::string::String`, whose serde impls live
# behind that feature. Without it the crate only compiled when some other member of
# the graph happened to enable serde's alloc/std, so `cargo check -p
# variegated-controller-types` failed on its own for both targets.
# `postcard` and `crc` are here rather than only under `sequential-storage` because
# `RoutineSummary::crc` is part of what a summary *means*, not a detail of how a routine is
# stored. Gating the computation would make the field's value depend on which features some
# other crate in the graph happened to turn on -- a listing that carried checksums in the
# firmware build and `None` everywhere else, which is precisely the kind of difference nobody
# finds until it is on hardware.
serde = ["dep:serde", "dep:postcard", "dep:crc", "variegated-control-algorithm/serde", "serde/derive", "serde/alloc", "heapless/serde"]
# The serde derives in this crate use `alloc::vec::Vec` and `alloc::string::String`,
# whose Serialize/Deserialize impls live behind serde's own `alloc`/`std` feature.
# This feature was previously `[]`, which meant the crate only ever built when some
# *other* member of the dependency graph happened to turn serde's std on -- it did
# not build standalone for a host target.
std = ["serde?/std"]
# `defmt/alloc` is required, not optional: `DebugPayload::Status` holds an
# `alloc::boxed::Box<Status>` (boxed to keep `DebugFrame` small), and defmt's
# `impl Format for Box<T>` lives behind that feature. Without it the `defmt::Format`
# derive on `DebugPayload` fails to resolve a bound for the boxed variant.
defmt = ["dep:defmt", "heapless/defmt", "defmt/alloc", "variegated-control-algorithm/defmt"]
# Describe these types for the TypeScript schema generator in variegated-comms-rs.
#
# Off by default and never enabled for firmware: it exists for host builds of the
# exporter. `variegated-postcard-schema`'s heapless and chrono impls are both required
# here -- `FnvIndexMap` appears on nearly every type in this crate, and
# `Status::current_local_time` is a `NaiveDateTime`.
#
# Implies `serde` deliberately. `cfg_attr(feature = "serde", serde(...))` attributes
# are stripped before derives run, so with serde off the schema derive's guard against
# unmodelled serde attributes would see nothing and pass a type it should reject.
schema = [
    "serde",
    "dep:variegated-postcard-schema",
    "variegated-postcard-schema/heapless",
    "variegated-postcard-schema/chrono",
    "variegated-control-algorithm/schema",
]
double_boiler = []
single_boiler = []
single_group = []
sequential-storage = ["dep:sequential-storage", "dep:postcard", "dep:crc", "serde"]
default = ["serde", "defmt", "double_boiler", "single_group"]