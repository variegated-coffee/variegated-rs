[package]
name = "variegated-debug"
version = "0.1.0"
edition = "2024"

[lib]
bench = false

[dependencies]
embassy-sync.workspace = true
embassy-time.workspace = true
portable-atomic.workspace = true
heapless.workspace = true
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false, features = ["serde", "double_boiler", "single_group"] }
variegated-debug-codec = { version = "0.1.0", path = "../variegated-debug-codec" }
variegated-instrumentation = { version = "0.1.0", path = "../variegated-instrumentation" }
variegated-checkin = { version = "0.1.0", path = "../variegated-checkin" }
defmt = { workspace = true, optional = true }
embassy-usb = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }

[features]
default = []
defmt = ["dep:defmt", "variegated-controller-types/defmt", "variegated-debug-codec/defmt", "variegated-checkin/defmt"]
instrumentation = ["variegated-instrumentation/instrumentation"]
# RP2350 USB CDC-ACM transport (Task 4).
usb-cdc-rp = ["dep:embassy-usb", "dep:embassy-futures", "dep:embassy-rp"]
# `embassy-rp` itself carries no chip feature: this is a shared library, like
# `variegated-hal`, and must not dictate the board its consumer targets. Hardcoding
# one here would collide via feature unification the moment anything in the build
# graph targets a different variant. The binary crate selects one of these.
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]
std = ["variegated-controller-types/std"]
# Exactly one of these must be enabled -- it stamps every frame this firmware emits.
# Both workspaces resolve the same embassy-sync, so this one crate serves both
# processors; the feature is what distinguishes them.
source-application = []
source-comms = []

[dev-dependencies]
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false, features = ["serde", "std", "double_boiler", "single_group"] }
# Dev-only: `relay`'s tests measure the *encoded* size of relayed frames, which is
# what the byte budget is denominated in. Nothing in the library encodes -- the relay
# in `variegated-comms` does that -- so this must not become a real dependency.
postcard = { workspace = true, features = ["alloc"] }
variegated-instrumentation = { version = "0.1.0", path = "../variegated-instrumentation", features = ["instrumentation"] }
# The host test binary links `embassy_sync::blocking_mutex::raw::CriticalSectionRawMutex`,
# which needs a `critical_section::Impl` registered at link time, and nothing
# else in the graph supplies one for the host target: on real hardware that
# comes from embassy-rp's `critical-section-impl` feature, pulled in by the
# firmware binary, not this library crate. Dev-only, so it never reaches the
# embedded build.
critical-section = { version = "1.2", features = ["std"] }
