[package]
name = "variegated-nv3007"
version = "0.1.0"
edition = "2021"
description = "Async driver for the NV3007 TFT LCD controller with embedded-graphics support"
repository = "https://github.com/variegated-coffee/variegated-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "async", "nv3007", "display", "graphics"]
categories = ["embedded", "hardware-support", "no-std", "graphics"]

[lib]
test = false
bench = false

[features]
default = ["graphics", "delta-updates"]
graphics = ["embedded-graphics-core"]
delta-updates = []
defmt = ["dep:defmt"]

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
display-interface.workspace = true
embassy-time.workspace = true
embassy-sync.workspace = true
heapless.workspace = true
defmt = { workspace = true, optional = true }
embedded-graphics-core = { workspace = true, optional = true }
# No variegated-instrumentation. `instrumented_section!` takes a measurement and drops it
# -- it has no output path at all -- so the timings it appeared to collect here never
# reached anything. `flush` returns `FlushStats` instead, and the caller decides where that
# goes.
# Frame differencing. A crate of its own so it can be tested: this one sets
# `[lib] test = false` and carries `embassy-rp` as a dev-dependency, so it cannot host a
# test binary -- `cargo test` here dies compiling `embassy-rp` for the host.
variegated-display-regions = { version = "0.1.0", path = "../variegated-display-regions" }

[dev-dependencies]
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "time-driver", "rp235xb"] }
display-interface-spi.workspace = true
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe = { workspace = true, features = ["print-defmt"] }
embedded-graphics.workspace = true