[package]
name = "variegated-improv-trouble"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Improv Wi-Fi provisioning: <https://www.improv-wifi.com/ble/>
#
# The wire codec has no BLE dependency and does not want one. Keeping `trouble-host`
# off the default path is what lets the test suite run on the host without an
# `embassy-time` driver, a `critical-section` implementation or a feature dance --
# trouble-host's own tests need all three (see its Cargo.toml dev-dependencies).
# The GATT service goes behind the optional `ble` feature so that stays true, and
# `codec` and `handler` must never reach for anything behind it.

# Deliberately NOT `harness = false`, unlike the sibling trouble crates. That setting
# makes cargo expect the lib to provide its own `main`, and the unit tests below would
# silently never run.
[lib]
bench = false

[dependencies]
heapless.workspace = true
defmt = { workspace = true, optional = true }

# All optional, all `ble`. The note at the top of this file is the reason.
trouble-host = { workspace = true, optional = true, features = ["gatt", "derive", "peripheral", "default-packet-pool"] }
# `workspace = true` as of trouble-host 0.7, and the history is worth keeping because the
# constraint could come back.
#
# This was pinned to 0.7 while trouble-host 0.6.0 depended on embassy-sync 0.7 and the
# workspace was on 0.8 for esp-hal and esp-radio. `#[gatt_service]` and `#[gatt_server]`
# expand to code containing literal `embassy_sync::blocking_mutex::raw::RawMutex` paths,
# resolved in whichever crate invokes the macro, and `AttributeTable`'s bound is
# trouble-host's `RawMutex`. With the wrong version in scope the generated bound is a
# *different trait of the same name*, and the error says so twice.
#
# trouble-host 0.7 depends on embassy-sync ^0.8, so the invoking crate and trouble now agree
# on 0.8 and the pin is not merely unnecessary but wrong -- it would reintroduce exactly the
# mismatch it was added to avoid. **If trouble's embassy-sync requirement ever diverges from
# the workspace's again, this goes back to a literal version.**
#
# Both macros are still invoked here rather than in the firmware, which remains the right
# place for them regardless of which version is in play.
embassy-sync = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
# Named by path in the macro output: each characteristic wider than 8 bytes gets a
# `static_cell::StaticCell` for its value storage.
static_cell = { workspace = true, optional = true }
# For the `ControllerCmdSync<Le…>` bounds `Peripheral::advertise` requires.
bt-hci = { workspace = true, optional = true }

[features]
default = ["defmt"]
defmt = ["dep:defmt", "heapless/defmt"]
# The GATT service, the advertisement and the run loop. Off by default so `cargo test`
# on the host stays a codec test.
ble = ["dep:trouble-host", "dep:embassy-sync", "dep:embassy-time", "dep:static_cell", "dep:bt-hci"]
