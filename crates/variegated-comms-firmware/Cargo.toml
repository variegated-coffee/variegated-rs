[package]
edition      = "2024"
name         = "variegated-comms-firmware"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "variegated-comms-firmware"
path = "./src/bin/main.rs"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[lib]
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[dependencies]
trouble-host = { git = "https://github.com/embassy-rs/trouble", features = ["gatt", "default-packet-pool", "default-packet-pool-mtu-255", "default-packet-pool-size-32", "peripheral", "central", "scan", "defmt", "gatt-client-notification-queue-size-16", "l2cap-rx-queue-size-16"] } # Git revision to get fix for multiple peripherals
variegated-trouble-connection-manager = { path = "../variegated-trouble-connection-manager" }
variegated-belka-portal-trouble-driver = { path = "../variegated-belka-portal-trouble-driver" }
variegated-scale-trouble-driver = { path = "../variegated-scale-trouble-driver" }
variegated-controller-types = { path = "../../variegated-rs/variegated-controller-types", default-features = false, features = ["serde", "defmt"] }
bt-hci = "0.6.0"
postcard = { version = "1.1.1", features = ["alloc", "use-crc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
embassy-sync = { version = "0.7", features = ["defmt"] }
portable-atomic = { version = "1.11", features = ["critical-section"] }
heapless = "0.8"
embassy-futures = "0.1"
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-net = { version = "0.7.1", features = [
  "defmt",
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
edge-net = { version = "0.11.2", features = ["embassy", "defmt", "io"]}
edge-http = { version = "0.6.1" }
edge-ws = { version = "0.4.0", default-features = false }
edge-nal = { version = "0.5.0" }
edge-nal-embassy = { version = "0.6.0", features = ["tcp"] }
embedded-io = { version = "0.6.1" }
embedded-io-async = { version = "0.6.1" }
esp-alloc = { version = "0.9.0" }
esp-backtrace = { version = "0.18.1", features = [
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.4.0" }
esp-hal = { version = "1.0.0", features = ["defmt", "unstable"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "timestamp"] }
esp-rtos = { version = "0.2.0", features = ["esp-radio", "defmt", "embassy"] }
static_cell = "2.1.1"
esp-radio = { version = "0.17.0", features = [
  "ble",
  "coex",
  "defmt",
  "smoltcp",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "defmt",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
] }
defmt = "1.0.1"
sntpc = { version = "0.6.1", default-features = false, features = ["embassy-socket", "embassy-socket-ipv6"] }
jiff = { version = "0.2.10", default-features = false, features = ["static"] }
log = "0.4.28"
esphome-device = { path = "../../esphome-device-rs", default-features = false, features = ["embassy_net", "defmt"] }

#[patch."https://github.com/vpetrigo/sntpc"]
#sntpc = { git = "https://github.com/vpetrigo/sntpc", branch = "master" }

[features]
default = [
  "esp-backtrace/esp32c6",
  "esp-bootloader-esp-idf/esp32c6",
  "esp-hal/esp32c6",
  "esp-rtos/esp32c6",
  "esp-radio/esp32c6",
]


