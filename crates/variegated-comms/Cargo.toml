[package]
name = "variegated-comms"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
# Embassy async framework
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures.workspace = true
# No embassy-rp. This crate runs on the application processor but names nothing from its
# HAL: the link's endpoints arrive as `embedded_io_async::Read`/`Write`, so the firmware
# that owns the peripheral is the only thing that has to know it is a UART. Do not add it
# back to reach for a peripheral type -- take a trait and let the caller supply it.
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-time = { workspace = true, features = ["defmt"] }
variegated-timekeeping = { path = "../variegated-timekeeping", features = [] }
chrono.workspace = true

# Serialization
# NOTE: postcard's default feature is `heapless-cas` (no-std safe), and every
# sibling crate depends on postcard with defaults on, so they unify anyway.
#
# `use-crc` is for the CRC-32C trailer a served routine definition carries, so the
# fetch path frames a routine the same way flash does. `variegated-controller-types`
# already enables it, so resolver 2 would unify it in regardless -- named here anyway,
# because a served routine's framing must not depend on which other crates happen to be
# in the graph.
postcard = { workspace = true, features = ["alloc", "use-crc"] }
# The same CRC-32/ISCSI that `Routine`'s `Value` impl stores with.
crc.workspace = true
serde.workspace = true
# For the fixed-capacity byte vectors the chunked wire variants carry. Building a
# `RoutineChunk` means naming its `heapless::Vec` payload, so this crate has to see the
# same `heapless` the types crate does -- the workspace pin is what keeps them the same
# version, since two would not unify and the field would be unconstructable.
heapless.workspace = true

# Core libraries
embedded-alloc.workspace = true
defmt.workspace = true
# The link's two endpoints are taken as `Read`/`Write` rather than as embassy-rp's
# concrete `UartRx`/`UartTx`, so this crate names no UART type of its own -- see the
# note on `esp_transceiver_main`'s `RX`/`TX` parameters.
embedded-io-async.workspace = true

# Local dependencies
variegated-controller-lib = { path = "../variegated-controller-lib" }
variegated-controller-types = { path = "../variegated-controller-types" }
# This crate runs on the application processor, so `source-application` is not a
# choice its consumer could reasonably make differently -- unlike `variegated-log`,
# which is consumed by both firmwares and therefore leaves the choice to the binary.
# Selecting it here is what lets `cargo check -p variegated-comms` work at all:
# `variegated-debug` is a `compile_error!` until exactly one source is chosen.
variegated-debug = { version = "0.1.0", path = "../variegated-debug", features = ["source-application"] }

[features]
default = []