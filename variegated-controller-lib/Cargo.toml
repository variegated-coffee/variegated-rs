[package]
name = "variegated-controller-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
test = false
bench = false

[dependencies]
heapless.workspace = true
async-trait.workspace = true
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embassy-embedded-hal = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures.workspace = true
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
num-traits = { workspace = true, features = ["libm"] }

movavg.workspace = true

defmt.workspace = true

serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["alloc", "use-crc"] }

cfg-if.workspace = true
variegated-hal = { version = "0.1.0", path = "../variegated-hal" }
variegated-control-algorithm = { version = "0.1.0", path = "../variegated-control-algorithm", features = ["defmt", "serde"] }
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", features = ["defmt", "serde", "sequential-storage"] }
variegated-timekeeping = { version = "0.1.0", path = "../variegated-timekeeping", features = ["defmt"] }
chrono.workspace = true

sequential-storage = { workspace = true, features = ["defmt"] }
embedded-storage-async.workspace = true
log.workspace = true
# Supplies the `log_*!` macros, which dual-emit to `defmt` (probe) and the `log`
# facade (bridged onto the debug bus by the binary).
variegated-log = { version = "0.1.0", path = "../variegated-log" }
# For the promoted typed events (brew/steam/routine/storage/interlock). Note that
# `variegated-debug` refuses to compile until exactly one of its
# `source-application` / `source-comms` features is selected -- that choice belongs
# to the firmware binary, and every build that reaches this crate makes it.
variegated-debug = { version = "0.1.0", path = "../variegated-debug" }

crc.workspace = true

[features]
rp2040 = ["embassy-rp/rp2040", "variegated-log/rp2040", "variegated-hal/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rp235x", "variegated-log/rp235xa", "variegated-hal/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "rp235x", "variegated-log/rp235xb", "variegated-hal/rp235xb"]
rp235x = []
pwm-steam-valve = []
