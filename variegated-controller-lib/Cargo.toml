[package]
name = "variegated-controller-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
test = false
bench = false

[dependencies]
heapless.workspace = true
async-trait.workspace = true
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embassy-embedded-hal = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures.workspace = true
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
num-traits = { workspace = true, features = ["libm"] }

movavg.workspace = true

defmt.workspace = true

serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true, features = ["alloc", "use-crc"] }

cfg-if.workspace = true
variegated-hal = { version = "0.1.0", path = "../variegated-hal" }
variegated-control-algorithm = { version = "0.1.0", path = "../variegated-control-algorithm", features = ["defmt", "serde"] }
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", features = ["defmt", "serde", "sequential-storage"] }
variegated-timekeeping = { version = "0.1.0", path = "../variegated-timekeeping", features = ["defmt"] }
chrono.workspace = true

sequential-storage = { workspace = true, features = ["defmt"] }
embedded-storage-async.workspace = true
log.workspace = true
# Supplies the `log_*!` macros, which dual-emit to `defmt` (probe) and the `log`
# facade, plus `emit_event` for the promoted typed events. Deliberately *not* a
# dependency on `variegated-debug`: that crate `compile_error!`s until a
# `source-application` / `source-comms` feature is picked, and a debug feature
# must not impose that on everyone who links this library. `variegated-log`
# keeps it optional behind its own `debug-bus` feature.
variegated-log = { version = "0.1.0", path = "../variegated-log" }

crc.workspace = true

# SD card storage (optional). See the rationale block in the workspace manifest for
# why this is `sdio` + `exfat-slim` rather than `embedded-sdmmc`.
# `sdio/trace` is deliberately NOT enabled here. It logs every command, response and
# data token, which is what made the SPI bring-up debuggable at all -- but it is
# thousands of lines per filesystem operation. Add `"trace"` to this list when a card
# will not come up, and take it out again afterwards.
sdio = { workspace = true, optional = true, features = ["defmt"] }
exfat-slim = { workspace = true, optional = true, features = ["defmt"] }
aligned = { workspace = true, optional = true }
# The exFAT formatter. Its own crate so it can be host-tested against volumes a real
# implementation produced; see the note at its re-export in `lib.rs`.
variegated-exfat-format = { version = "0.1.0", path = "../variegated-exfat-format", optional = true, features = ["defmt"] }
block-device-driver = { workspace = true, optional = true }

[features]
rp2040 = ["embassy-rp/rp2040", "variegated-log/rp2040", "variegated-hal/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rp235x", "variegated-log/rp235xa", "variegated-hal/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "rp235x", "variegated-log/rp235xb", "variegated-hal/rp235xb"]
rp235x = []
pwm-steam-valve = []
sd-card-storage = ["dep:sdio", "dep:exfat-slim", "dep:aligned", "dep:block-device-driver", "dep:variegated-exfat-format"]
