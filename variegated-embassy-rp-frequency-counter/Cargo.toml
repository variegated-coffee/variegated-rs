[package]
name = "variegated-embassy-rp-frequency-counter"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
pio-proc = "0.3"
pio.workspace = true
pio-core = "0.3.0"
log.workspace = true
variegated-log = { version = "0.1.0", path = "../variegated-log" }
defmt.workspace = true
defmt-rtt.workspace = true
cortex-m = { workspace = true, features = ["inline-asm"] }
cortex-m-rt.workspace = true
panic-probe = { workspace = true, features = ["print-defmt"] }

[features]
default = []
rp2040 = ["embassy-rp/rp2040", "variegated-log/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "variegated-log/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "variegated-log/rp235xb"]