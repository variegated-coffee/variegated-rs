[package]
name = "variegated-log"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
defmt.workspace = true
defmt-rtt.workspace = true
log.workspace = true
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-usb-logger.workspace = true
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
# Optional, and gated behind `debug-bus`: this is the only thing in the tree that
# needs `variegated-debug`, and `variegated-debug` refuses to compile until a
# `source-application` / `source-comms` feature is chosen. Keeping it optional is
# what stops that requirement from leaking out to every consumer of the `log_*!`
# macros -- `variegated-hal` and `variegated-controller-lib` depend on this crate
# for the macros alone and must not inherit a debug-only API imposition.
variegated-debug = { version = "0.1.0", path = "../variegated-debug", optional = true }
embassy-time = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
# Not optional: `emit_event` names `DebugEvent` in both its enabled and its
# no-op form, so the type has to resolve with `debug-bus` off. This crate is
# cheap to depend on -- no embassy, and `variegated-hal` /
# `variegated-controller-lib` already carry it.
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false }

[features]
default = []
rp2040 = ["embassy-rp/rp2040"]
rp235xa = ["embassy-rp/rp235xa"]
rp235xb = ["embassy-rp/rp235xb"]
# The debug-stream bridge, in both directions:
#   * `bus_sink` republishes every `log` record as `DebugPayload::Text`
#   * `emit_event` forwards typed `DebugEvent`s from the libraries
# Opt-in per firmware: the binary installs the logger with
# `variegated_log::bus_sink::init()`. With this off, `emit_event` compiles to a
# no-op and nothing in the graph pulls in `variegated-debug`.
#
# Deliberately does *not* select `variegated-debug`'s `source-application` /
# `source-comms` feature -- that choice belongs to the binary, exactly as it does
# for `variegated-debug` itself.
debug-bus = ["dep:variegated-debug", "dep:embassy-time", "dep:portable-atomic"]