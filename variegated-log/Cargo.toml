[package]
name = "variegated-log"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
defmt.workspace = true
log.workspace = true
# All four of these exist for one thing: `logger_task`, the RP2350 USB serial
# logger, plus the defmt-RTT transport that feeds a probe. They are optional
# because this crate is no longer RP-only -- the ESP32-C6 comms firmware installs
# `bus_sink` too, and none of these can build for riscv32: `embassy-executor`
# here asks for `platform-cortex-m`, and `embassy-rp` is a Cortex-M PAC.
#
# `defmt-rtt` had to become optional for a second, independent reason: it defines
# a `#[defmt::global_logger]`, and so does `esp-println/defmt-espflash`. Two in
# one binary is a duplicate-symbol link error, not a warning.
#
# Selected by the chip features below rather than standing alone, so every
# existing consumer -- all of which already name a chip -- is completely
# unaffected.
defmt-rtt = { workspace = true, optional = true }
embassy-executor = { workspace = true, optional = true, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-usb-logger = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
# Optional, and gated behind `debug-bus`: this is the only thing in the tree that
# needs `variegated-debug`, and `variegated-debug` refuses to compile until a
# `source-application` / `source-comms` feature is chosen. Keeping it optional is
# what stops that requirement from leaking out to every consumer of the `log_*!`
# macros -- `variegated-hal` and `variegated-controller-lib` depend on this crate
# for the macros alone and must not inherit a debug-only API imposition.
variegated-debug = { version = "0.1.0", path = "../variegated-debug", optional = true }
embassy-time = { workspace = true, optional = true }
portable-atomic = { workspace = true, optional = true }
# Not optional: `emit_event` names `DebugEvent` in both its enabled and its
# no-op form, so the type has to resolve with `debug-bus` off. This crate is
# cheap to depend on -- no embassy, and `variegated-hal` /
# `variegated-controller-lib` already carry it.
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types", default-features = false }

[features]
default = []
# The RP-only half of this crate: `logger_task` and the defmt-RTT global logger.
# Not a feature a consumer selects directly -- naming a chip is what turns it on,
# which is why nothing downstream had to change when it appeared.
rp-usb-logger = ["dep:defmt-rtt", "dep:embassy-executor", "dep:embassy-usb-logger", "dep:embassy-rp"]
rp2040 = ["rp-usb-logger", "embassy-rp/rp2040"]
rp235xa = ["rp-usb-logger", "embassy-rp/rp235xa"]
rp235xb = ["rp-usb-logger", "embassy-rp/rp235xb"]
# The debug-stream bridge, in both directions:
#   * `bus_sink` republishes every `log` record as `DebugPayload::Text`
#   * `emit_event` forwards typed `DebugEvent`s from the libraries
# Opt-in per firmware: the binary installs the logger with
# `variegated_log::bus_sink::init()`. With this off, `emit_event` compiles to a
# no-op and nothing in the graph pulls in `variegated-debug`.
#
# Deliberately does *not* select `variegated-debug`'s `source-application` /
# `source-comms` feature -- that choice belongs to the binary, exactly as it does
# for `variegated-debug` itself.
debug-bus = ["dep:variegated-debug", "dep:embassy-time", "dep:portable-atomic"]