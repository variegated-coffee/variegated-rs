[package]
name = "variegated-controller-types"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
defmt = { workspace = true, optional = true }
heapless.workspace = true
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"], optional = true }
# `defmt` is inherited through this crate's own `defmt` feature rather than being
# hardcoded here. Hardcoding it put defmt into *every* graph that touches these types,
# including host builds -- and defmt declares `links = "defmt"` and emits `extern "Rust"`
# references to `_defmt_acquire`/`_defmt_write`/`_defmt_timestamp` with no provider, so a
# host binary that monomorphizes any `Format` impl fails to link. That matters now that
# the schema exporter runs as a build script.
variegated-control-algorithm = { version = "0.1.0", path = "../variegated-control-algorithm", default-features = false }
sequential-storage = { workspace = true, optional = true, features = ["defmt"] }
postcard = { workspace = true, optional = true, features = ["alloc", "use-crc"] }
crc = { workspace = true, optional = true }

[features]
# `serde/alloc` is required, not optional: the derives in this crate cover types
# containing `alloc::vec::Vec` and `alloc::string::String`, whose serde impls live
# behind that feature. Without it the crate only compiled when some other member of
# the graph happened to enable serde's alloc/std, so `cargo check -p
# variegated-controller-types` failed on its own for both targets.
serde = ["dep:serde", "variegated-control-algorithm/serde", "serde/derive", "serde/alloc", "heapless/serde"]
# The serde derives in this crate use `alloc::vec::Vec` and `alloc::string::String`,
# whose Serialize/Deserialize impls live behind serde's own `alloc`/`std` feature.
# This feature was previously `[]`, which meant the crate only ever built when some
# *other* member of the dependency graph happened to turn serde's std on -- it did
# not build standalone for a host target.
std = ["serde?/std"]
# `defmt/alloc` is required, not optional: `DebugPayload::Status` holds an
# `alloc::boxed::Box<Status>` (boxed to keep `DebugFrame` small), and defmt's
# `impl Format for Box<T>` lives behind that feature. Without it the `defmt::Format`
# derive on `DebugPayload` fails to resolve a bound for the boxed variant.
defmt = ["dep:defmt", "heapless/defmt", "defmt/alloc", "variegated-control-algorithm/defmt"]
double_boiler = []
single_boiler = []
single_group = []
sequential-storage = ["dep:sequential-storage", "dep:postcard", "dep:crc", "serde"]
default = ["serde", "defmt", "double_boiler", "single_group"]