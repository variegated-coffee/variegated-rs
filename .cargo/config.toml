[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Choose a default "cargo run" tool (see README for more info)
# - `probe-rs` provides flashing and defmt via a hardware debugger, and stack unwind on panic
# - elf2uf2-rs loads firmware over USB when the rp2040 is in boot mode
#runner = "probe-rs run --chip RP2040 --protocol swd --probe 1366:0105"
#runner = "probe-rs run --chip RP235x --protocol swd --probe 2e8a:000c:E6633861A3554938"
#runner = "probe-rs run --chip RP235x --protocol swd --probe 2e8a:000c:E66430A64B3D6822"
#runner = "probe-rs run --chip RP235x --protocol swd --probe 2e8a:000c:E66430A64B5D2F27"
# Cargo resolves `.cargo/config.toml` by walking up from the *current working directory*,
# not from the manifest, so this file is what you get when you run from the repo root and
# the two firmware crates' own copies are what you get when you `cd` into one. Running from
# a crate directory is the intended path -- there each `runner` is `./probe-runner.sh` and
# there is no ambiguity. This entry only has to name one of them, and names the GS3 because
# that is the machine the old `default-run = "dual_boiler"` pointed at.
runner = "./firmwares/variegated-gs3-firmware/probe-runner.sh"
#runner = "elf2uf2-rs"

# flip-link does NOT work on this target. Tried 2026-08-10 while chasing a HardFault, and
# it took the machine from "boots and runs for 1.3 s" to "dies before the first log line" --
# no defmt output at all, and a core 1 backtrace resolving addresses like `0x000000da` and
# `0xfa050000` that are not in RP2350 RAM (`0x20000000`-`0x2007FFFF`).
#
# The relocation itself worked: `.data`/`.bss`/`.uninit` moved to the top of RAM and the
# stack became the low region, verified with `llvm-size -A`. Something else about this
# board's early boot does not survive that layout; the mechanism was not identified, and
# `install_core0_stack_guard()` is not the answer -- this example never calls it, and
# `core1_setup` sets MSPLIM on core 1 for core 1, correctly, from `spawn_core1`.
#
# Left as a note rather than a commented-out flag, because "someone should try flip-link"
# is an idea that will recur and this is the record of what happened when it was tried.
# Use the stack painting in `variegated-gs3-firmware` instead: it measures the same thing
# without touching the memory layout.

[target.'cfg(test)']
rustflags = ["--cfg", "test"]

[alias]
test-aarch64 = "test --target aarch64-apple-darwin"  # Run tests with this target

# WARNING: this `rustflags` key is INERT. It sits under `[alias]`, so cargo reads
# it as an alias named "rustflags" rather than as build flags -- verified with
# `cargo build -v`, which shows no `inline-threshold` in any rustc invocation.
#
# Left as-is deliberately: moving it under `[build]` would newly apply
# `-C no-vectorize-loops` and change code size/performance, which is a decision
# to make on purpose rather than as a side effect of a dependency upgrade.
# Note that `-C inline-threshold` has also been a deprecated no-op since Rust
# 1.78, so only `no-vectorize-loops` would actually take effect.
rustflags = [
#    "-C", "linker=flip-link",
#    "-C", "link-arg=--nmagic",
#    "-C", "link-arg=-Tlink.x",
#    "-C", "link-arg=-Tdefmt.x",

    # Code-size optimizations.
    #   trap unreachable can save a lot of space, but requires nightly compiler.
    #   uncomment the next line if you wish to enable it
    # "-Z", "trap-unreachable=no",
    "-C", "inline-threshold=5",
    "-C", "no-vectorize-loops",
]

[build]
target = "thumbv8m.main-none-eabihf"

[env]
DEFMT_LOG = "debug"
# 262144, not the 131072 this file used to carry. That was never the value real builds
# used: the documented procedure was `cd examples && cargo build`, which picked up
# `examples/.cargo/config.toml` and its 262144 instead, so the smaller number here only
# ever applied to builds run from the repo root -- silently giving those half the arena.
# The two firmware crates' own configs also say 262144, so all three now agree.
EMBASSY_EXECUTOR_TASK_ARENA_SIZE="262144"