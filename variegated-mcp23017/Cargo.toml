[package]
name = "variegated-mcp23017"
version = "0.1.0"
edition = "2021"
description = "Async driver for the MCP23017 16-bit I2C GPIO expander"
repository = "https://github.com/variegated-coffee/variegated-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "async", "mcp23017", "gpio", "i2c"]
categories = ["embedded", "hardware-support", "no-std"]

[lib]
test = false
bench = false

[features]
default = []
defmt = ["dep:defmt"]
async-digital-pins = ["dep:embedded-hal-async-git"]

[dependencies]
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embassy-sync = "0.7.0"
embassy-futures = "0.1.0"
defmt = { version = "0.3", optional = true }

# Use git version when async-digital-pins feature is enabled
[dependencies.embedded-hal-async-git]
package = "embedded-hal-async"
git = "https://github.com/rust-embedded/embedded-hal"
branch = "master"
optional = true

[dev-dependencies]
embassy-executor = { version = "0.7.0", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4.0", features = ["defmt"] }
embassy-rp = { version = "0.6.0", features = ["defmt", "time-driver", "rp235xb"] }
embassy-embedded-hal = { version = "0.3.0", features = ["defmt"] }
cortex-m-rt = "0.7.0"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }