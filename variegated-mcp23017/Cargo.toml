[package]
name = "variegated-mcp23017"
version = "0.1.0"
edition = "2021"
description = "Async driver for the MCP23017 16-bit I2C GPIO expander"
repository = "https://github.com/variegated-coffee/variegated-rs"
license = "MIT OR Apache-2.0"
keywords = ["embedded", "async", "mcp23017", "gpio", "i2c"]
categories = ["embedded", "hardware-support", "no-std"]

[lib]
test = false
bench = false

[features]
default = []
defmt = ["dep:defmt"]
async-digital-pins = ["dep:embedded-hal-async-git"]

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embassy-sync.workspace = true
embassy-futures.workspace = true
defmt = { workspace = true, optional = true }

# Use git version when async-digital-pins feature is enabled
[dependencies.embedded-hal-async-git]
package = "embedded-hal-async"
git = "https://github.com/rust-embedded/embedded-hal"
branch = "master"
optional = true

[dev-dependencies]
embassy-executor = { workspace = true, features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { workspace = true, features = ["defmt"] }
embassy-rp = { workspace = true, features = ["defmt", "time-driver", "rp235xb"] }
embassy-embedded-hal = { workspace = true, features = ["defmt"] }
cortex-m-rt.workspace = true
defmt.workspace = true
defmt-rtt.workspace = true
panic-probe = { workspace = true, features = ["print-defmt"] }