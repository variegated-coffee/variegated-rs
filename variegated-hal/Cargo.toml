[package]
name = "variegated-hal"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false

[dependencies]
variegated-soft-pwm = { version = "0.1.0", path = "../variegated-soft-pwm" }
embassy-time = { workspace = true, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embassy-embedded-hal = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-futures.workspace = true
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
static_cell.workspace = true
variegated-rp235x-atomic-raw-mutex = { version = "0.1.0", path = "../variegated-rp235x-atomic-raw-mutex", optional = true }
variegated-ads124s08 = { version = "0.1.0", path = "../variegated-ads124s08" }
variegated-fdc1004 = { version = "0.1.0", path = "../variegated-fdc1004", features = ["defmt"] }
variegated-mcp9600 = { version = "0.1.0", path = "../variegated-mcp9600", features = ["defmt"] }
variegated-adc-tools = { version = "0.1.0", path = "../variegated-adc-tools" }
variegated-gravity-driver = { version = "0.1.0", path = "../variegated-gravity-driver", features = ["defmt"] }
variegated-instrumentation = { version = "0.1.0", path = "../variegated-instrumentation" }
defmt.workspace = true
async-trait.workspace = true
variegated-controller-types = { version = "0.1.0", path = "../variegated-controller-types" }
movavg.workspace = true
log.workspace = true
# Supplies the `log_*!` macros, which dual-emit to `defmt` (probe) and the `log`
# facade (bridged onto the debug bus by the binary).
variegated-log = { version = "0.1.0", path = "../variegated-log" }
# For the promoted `SensorFault` event. See the note in variegated-controller-lib
# about the `source-*` feature: the firmware binary selects it.
variegated-debug = { version = "0.1.0", path = "../variegated-debug" }
heapless = { workspace = true, features = ["defmt"] }
fixed.workspace = true
pio.workspace = true

[features]
rp2040 = ["embassy-rp/rp2040", "variegated-log/rp2040"]
rp235xa = ["embassy-rp/rp235xa", "rp235x", "variegated-log/rp235xa"]
rp235xb = ["embassy-rp/rp235xb", "rp235x", "variegated-log/rp235xb"]
rp235x = []
atomic-mutex = ["dep:variegated-rp235x-atomic-raw-mutex", "rp235x"]
